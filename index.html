<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#86d97a">
<title>小车大冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小车大冒险">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#4d5470;touch-action:none;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  .hud{position:absolute;left:0;right:0;top:calc(8px + env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(10px,3vw,24px);pointer-events:none;}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:999px;
    padding:4px clamp(12px,3vw,18px) 4px 10px;box-shadow:0 4px 0 rgba(0,0,0,.14);}
  .pill .ico{font-size:clamp(21px,5.4vmin,30px);line-height:1;}
  .pill .num{font-size:clamp(19px,5vmin,27px);font-weight:900;color:#4a3b1c;min-width:30px;}
  #mute{pointer-events:auto;width:clamp(40px,9vmin,54px);height:clamp(40px,9vmin,54px);
    border:none;border-radius:50%;background:rgba(255,255,255,.9);
    box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:clamp(19px,4.6vmin,26px);
    display:grid;place-items:center;cursor:pointer;}
  #mute:active{transform:translateY(2px);}

  .progress{position:absolute;left:50%;transform:translateX(-50%);
    top:calc(clamp(56px,12vmin,84px) + env(safe-area-inset-top));
    width:min(64%,520px);height:clamp(11px,2.4vmin,16px);background:rgba(255,255,255,.42);
    border-radius:999px;box-shadow:inset 0 2px 4px rgba(0,0,0,.15);pointer-events:none;}
  #progressFill{height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#ffe066,#ffb425,#ff8a3d);transition:width .12s linear;}
  .progress .flag{position:absolute;right:-14px;top:-13px;font-size:clamp(20px,4.6vmin,26px);line-height:1;}

  .controls{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;padding:0 clamp(14px,6vw,64px);pointer-events:none;}
  .ctrl{pointer-events:auto;width:clamp(76px,18vmin,112px);height:clamp(76px,18vmin,112px);
    border:none;border-radius:50%;background:rgba(255,255,255,.88);color:#4a4a63;
    font-size:clamp(26px,7vmin,40px);line-height:1;display:grid;place-items:center;cursor:pointer;
    box-shadow:0 7px 0 rgba(0,0,0,.18),inset 0 -6px 0 rgba(0,0,0,.05);
    transition:transform .06s,background .06s;touch-action:none;}
  .ctrl:active{transform:translateY(4px);background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);}

  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:clamp(10px,3vmin,26px);background:rgba(38,42,68,.42);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;
    touch-action:pan-y;overscroll-behavior:contain;}
  .overlay.hidden{display:none;}
  .hud.hidden,.progress.hidden{display:none;}
  .card{width:min(92vw,720px);max-height:calc(100dvh - clamp(20px,6vmin,52px));
    overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
    background:#fffaf0;border-radius:clamp(22px,4vmin,36px);
    padding:clamp(16px,3.2vh,28px) clamp(14px,3.4vw,28px);
    text-align:center;box-shadow:0 18px 0 rgba(0,0,0,.16),0 24px 50px rgba(0,0,0,.25);
    animation:pop .3s cubic-bezier(.2,1.5,.5,1);}
  .card.small{width:min(90vw,420px);}
  @keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
  .logo{font-size:clamp(40px,9vmin,64px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.1));}
  .card h1{margin:6px 0 2px;font-size:clamp(24px,4.4vmin,34px);color:#3a3d5c;letter-spacing:2px;}
  .card .sub{margin:4px 0 0;font-size:clamp(13px,2.5vmin,17px);color:#7a7f9c;
    font-weight:600;letter-spacing:1px;}

  .garage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:clamp(6px,1.4vmin,12px);margin-top:clamp(10px,2.2vh,18px);}
  .car-card{display:flex;flex-direction:column;align-items:center;gap:1px;
    border:3px solid transparent;border-radius:clamp(14px,2.6vmin,20px);background:#fff;
    padding:clamp(6px,1.4vh,10px) 4px;box-shadow:0 3px 0 rgba(0,0,0,.08);
    cursor:pointer;font-family:inherit;transition:transform .08s,border-color .12s;}
  .car-card:active{transform:scale(.96);}
  .car-card.on{border-color:#ffb43d;background:#fff6e2;box-shadow:0 3px 0 #e59b2a;}
  .car-logo{width:clamp(34px,7.4vmin,48px);height:clamp(34px,7.4vmin,48px);display:block;object-fit:contain;}
  .car-brand{font-size:clamp(12px,2.4vmin,15px);font-weight:900;color:#3a3d5c;line-height:1.3;}
  .car-model{font-size:clamp(10px,2vmin,12px);font-weight:600;color:#8a8fa8;line-height:1.2;}

  .big-btn{margin-top:clamp(12px,2.4vh,20px);width:100%;padding:clamp(13px,2.6vh,18px) 0;
    border:none;border-radius:999px;font-family:inherit;font-size:clamp(22px,5vmin,30px);
    font-weight:900;letter-spacing:3px;color:#fff;
    background:linear-gradient(180deg,#ffb43d,#ff8a2b);
    box-shadow:0 8px 0 #d96b12,0 10px 22px rgba(217,107,18,.35);cursor:pointer;}
  .big-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #d96b12;}
  .ghost-btn{margin-top:8px;width:100%;padding:clamp(9px,2vh,13px) 0;border:none;
    border-radius:999px;background:transparent;color:#9298b0;font-family:inherit;
    font-size:clamp(13px,2.8vmin,16px);font-weight:700;cursor:pointer;}
  .ghost-btn:active{color:#5a5f79;}
  .hint{margin:clamp(8px,2vh,16px) 0 0;font-size:clamp(12px,2.4vmin,14px);
    line-height:1.7;color:#9a9db2;}
  .tiny{margin:6px 0 0;font-size:clamp(10px,1.9vmin,12px);color:#b6bacb;line-height:1.5;}
  .score{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 2px;
    font-size:52px;font-weight:900;color:#4a3b1c;line-height:1;}
  .score span{font-size:44px;}
  .score b{font-size:56px;}
  .finish-car{display:flex;justify-content:center;margin-bottom:2px;}
  .finish-car img{width:clamp(56px,12vmin,80px);height:clamp(56px,12vmin,80px);
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.1));}

  .hud-right{display:flex;gap:clamp(6px,1.6vmin,10px);pointer-events:none;}
  #pause{pointer-events:auto;width:clamp(40px,9vmin,54px);height:clamp(40px,9vmin,54px);
    border:none;border-radius:50%;background:rgba(255,255,255,.9);
    box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:clamp(17px,4.2vmin,24px);
    display:grid;place-items:center;cursor:pointer;color:#4a4a63;}
  #pause:active{transform:translateY(2px);}

  #effects{position:absolute;left:50%;transform:translateX(-50%);
    top:calc(clamp(94px,19vmin,128px) + env(safe-area-inset-top));
    display:flex;gap:6px;pointer-events:none;}
  #effects .fx{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);
    border-radius:999px;padding:3px 9px;font-size:clamp(12px,2.6vmin,15px);font-weight:800;
    color:#4a3b1c;box-shadow:0 2px 0 rgba(0,0,0,.12);}
  #effects:empty{display:none;}

  .level-chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    background:#eef7e6;border-radius:999px;padding:4px 12px;
    font-size:clamp(12px,2.5vmin,15px);font-weight:800;color:#4f7a3a;}
  .level-chip b{color:#3a5c28;}

  .rating{display:flex;justify-content:center;gap:clamp(4px,2vw,10px);margin:6px 0 0;}
  .rating span{font-size:clamp(30px,7.6vmin,46px);line-height:1;
    filter:grayscale(1) brightness(.85);opacity:.32;transition:transform .25s,opacity .25s,filter .25s;}
  .rating span.on{filter:none;opacity:1;animation:starPop .45s cubic-bezier(.2,1.7,.5,1) both;}
  @keyframes starPop{from{transform:scale(.4) rotate(-18deg)}to{transform:scale(1) rotate(0)}}

  #cardWrap{margin:8px 0 0;display:none;}
  #cardWrap.on{display:block;}
  #cardImg{width:min(72vw,260px);border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.12);display:inline-block;}
  #saveCard{margin-top:6px;}

  #quitBtn{position:relative;overflow:hidden;}
  #quitBtn .fill{position:absolute;left:0;top:0;height:100%;width:0;
    background:rgba(255,120,80,.20);transition:width 2s linear;pointer-events:none;}
  #quitBtn.holding .fill{width:100%;}

  @media (max-width:560px){
    .garage{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px;}
    .card{padding:16px 12px;border-radius:24px;}
    .logo{font-size:42px;}
    .car-logo{width:40px;height:40px;}
    .car-card{padding:7px 3px;border-width:2px;}
    .car-brand{font-size:13px;}
    .car-model{font-size:10px;}
    .big-btn{margin-top:12px;padding:13px 0;font-size:22px;}
    .hint{margin-top:8px;line-height:1.5;}
  }
  @media (min-width:900px){
    .card{width:min(84vw,780px);}
  }
  @media (max-height:540px){
    .card{padding:12px 16px;border-radius:22px;}
    .logo{display:none;}
    .card h1{font-size:22px;margin:0;}
    .card .sub{font-size:12px;margin-top:2px;}
    .garage{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:8px;gap:6px;}
    .car-card{padding:5px 3px;}
    .car-logo{width:30px;height:30px;}
    .car-brand{font-size:11px;}
    .car-model{display:none;}
    .big-btn{margin-top:10px;padding:11px 0;font-size:21px;}
    .hint,.tiny{display:none;}
    .finish-car img{width:46px;height:46px;}
    .score{font-size:40px;margin:6px 0 0;}
    .score b{font-size:44px;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div class="hud hidden" id="hud">
    <div class="pill"><span class="ico">字</span><span class="num" id="starCount">0</span></div>
    <div class="hud-right">
      <button id="pause" aria-label="暂停">⏸</button>
      <button id="mute" aria-label="声音开关">🔊</button>
    </div>
  </div>

  <div id="effects"></div>

  <div class="progress hidden" id="progress"><div id="progressFill"></div><span class="flag">🏁</span></div>

  <div class="controls">
    <button class="ctrl" id="leftBtn" aria-label="向左">◀</button>
    <button class="ctrl" id="rightBtn" aria-label="向右">▶</button>
  </div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <div class="logo">🏎️</div>
      <h1>小车大冒险</h1>
      <p class="sub">选一辆喜欢的车，收集汉字学读音！</p>
      <div class="level-chip" id="levelChip">第 1 关 · 城市</div>
      <div class="garage" id="garage"></div>
      <button class="big-btn" id="startBtn">开始 ▶</button>
      <p class="hint">按住 ◀ ▶ 左右移动 · 也可拖动小车</p>
      <p class="tiny">车标图片来自公开素材库，仅家庭非商业使用；商标归各品牌所有</p>
    </div>
  </div>

  <div class="overlay hidden" id="finishScreen">
    <div class="card small">
      <div class="finish-car"><img id="finishLogo" alt=""></div>
      <h1>到终点啦！</h1>
      <div class="rating" id="finishRating"><span>⭐</span><span>⭐</span><span>⭐</span></div>
      <div class="score"><span>字</span><b id="finishStars">0</b></div>
      <p class="sub" id="finishModel">法拉利 488</p>
      <div id="cardWrap"><img id="cardImg" alt="成绩卡"><br>
        <a class="ghost-btn" id="saveCard" download="car-race-score.png">保存成绩图</a></div>
      <button class="big-btn" id="nextBtn">下一关 ▶</button>
      <button class="ghost-btn" id="againBtn">再玩一次 ↻</button>
      <button class="ghost-btn" id="changeBtn">换一辆车</button>
    </div>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <div class="card small">
      <div class="logo">⏸</div>
      <h1>休息一下</h1>
      <p class="sub">小车在路边等你</p>
      <button class="big-btn" id="resumeBtn">继续 ▶</button>
      <button class="ghost-btn" id="quitBtn"><span class="fill"></span>长按 2 秒回车库</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- 基础工具 ----------
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const starsEl = document.getElementById('starCount');
  const muteBtn = document.getElementById('mute');
  const hudEl = document.getElementById('hud');
  const progressEl = document.getElementById('progress');
  const barEl = document.getElementById('progressFill');
  const startScreen = document.getElementById('startScreen');
  const finishScreen = document.getElementById('finishScreen');
  const finishStarsEl = document.getElementById('finishStars');
  const finishLogoEl = document.getElementById('finishLogo');
  const finishModelEl = document.getElementById('finishModel');
  const garageEl = document.getElementById('garage');
  const pauseBtn = document.getElementById('pause');
  const pauseScreen = document.getElementById('pauseScreen');
  const resumeBtn = document.getElementById('resumeBtn');
  const quitBtn = document.getElementById('quitBtn');
  const effectsEl = document.getElementById('effects');
  const levelChipEl = document.getElementById('levelChip');
  const ratingEl = document.getElementById('finishRating');
  const cardWrapEl = document.getElementById('cardWrap');
  const cardImgEl = document.getElementById('cardImg');
  const saveCardEl = document.getElementById('saveCard');
  const nextBtn = document.getElementById('nextBtn');

  const LANES = 4;
  const GOAL = 6200;

  // 路上可收集的汉字（吃掉时会朗读对应读音）
  const CHARS = [
    '前', '包', '可', '后', '今', '方', '平', '么', '间', '升', '众', '林', '吧', '呀', '比', '友', '又',
    '长', '中', '本', '布', '会', '瓜', '禾', '怎', '回', '告', '森', '明', '呢', '啦', '朋', '飞',
    '公', '毛', '兴', '年', '正', '广', '什', '没', '问', '从', '男', '吗', '啊', '米', '船', '车'
  ];
  let charPool = [];

  function nextChar() {
    if (!charPool.length) {
      charPool = CHARS.slice();
      for (let i = charPool.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        const t = charPool[i];
        charPool[i] = charPool[j];
        charPool[j] = t;
      }
    }
    return charPool.pop();
  }

  // 关卡主题：每关换一条赛道风景
  const THEMES = [
    { id: 'city', name: '城市', grass: ['#8fe084', '#6ccd63'], stripe: 'rgba(255,255,255,.07)',
      road: '#5d6483', edge: 'rgba(0,0,0,.16)', curb: ['#fbf7ea', '#f26a6a'],
      plant: 'tree', flower: ['#ffffff', '#ffd1e8'] },
    { id: 'desert', name: '沙漠', grass: ['#f7d98f', '#e7bc62'], stripe: 'rgba(255,255,255,.11)',
      road: '#8b7b64', edge: 'rgba(90,55,10,.20)', curb: ['#fff4d8', '#e0913f'],
      plant: 'cactus', flower: ['#ffe9a8', '#ffb86b'] },
    { id: 'snow', name: '雪地', grass: ['#eef5ff', '#cfe0f4'], stripe: 'rgba(255,255,255,.4)',
      road: '#6d7484', edge: 'rgba(40,60,90,.14)', curb: ['#ffffff', '#8fb6e6'],
      plant: 'pine', flower: ['#ffffff', '#bcd8ff'] },
    { id: 'beach', name: '海边', grass: ['#ffe3a8', '#f3c97b'], stripe: 'rgba(255,255,255,.14)',
      road: '#5f6b84', edge: 'rgba(30,60,90,.16)', curb: ['#fff8e8', '#4fb8d8'],
      plant: 'palm', flower: ['#ffffff', '#ff9fc4'] }
  ];

  // 车型与真实车标（车标取自公开车标素材库；商标归各品牌所有，本项目仅个人非商业使用）
  const BRANDS = [
    {

  const brandById = {};
  BRANDS.forEach(b => { brandById[b.id] = b; });
  const logoImgs = {};
  BRANDS.forEach(b => {
    const img = new Image();
    img.onload = () => { logoImgs[b.id] = img; };
    img.src = b.logo;
  });

  function getBrand() {
    return brandById[state.brandId] || BRANDS[0];
  }

  let W = 0, H = 0, DPR = 1;
  let roadLeft = 0, roadRight = 0, roadWidth = 0, laneW = 0;
  let carY = 0;
  let prevLeft = 0, prevWidth = 0;
  let initialized = false;

  const state = {
    mode: 'ready',        // ready | playing | paused | finish
    time: 0,
    stars: 0,
    distance: 0,
    speed: 0,
    carX: 0,
    carVX: 0,
    tilt: 0,
    invuln: 0,
    shake: 0,
    spawnAcc: 0,

    brandId: 'ferrari',
    goal: GOAL,
    scale: 1,
    level: 1,
    combo: 0,
    comboT: 0,
    magnet: 0,
    shield: 0,
    boost: 0,
    fxSig: '',
    rating: 0,
    spawnStars: 0
  };

  const bestStars = {};   // { 关卡: 最好星数 }

  try {
    const savedBrand = localStorage.getItem('car-race-brand');
    if (savedBrand && brandById[savedBrand]) state.brandId = savedBrand;
    const lv = parseInt(localStorage.getItem('car-race-level') || '1', 10);
    if (lv >= 1 && lv <= 99) state.level = lv;
    const bj = JSON.parse(localStorage.getItem('car-race-best') || '{}');
    for (const k in bj) if (bj[k] > 0) bestStars[k] = bj[k];
  } catch (e) { /* ignore */ }

  function themeOf(level) {
    return THEMES[(Math.max(1, level) - 1) % THEMES.length];
  }
  function curTheme() { return themeOf(state.level); }
  function saveProgress() {
    try {
      localStorage.setItem('car-race-level', String(state.level));
      localStorage.setItem('car-race-best', JSON.stringify(bestStars));
    } catch (e) { /* ignore */ }
  }

  const car = { w: 46, h: 72 };
  let objects = [];
  let particles = [];

  let dragId = null;

  let grassOffset = 0;
  let dashOffset = 0;
  let curbOffset = 0;

  // ---------- 声音 ----------
  let actx = null;
  function ensureAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur = 0.15, type = 'sine', delay = 0, vol = 0.16) {
    if (state.muted) return;
    ensureAudio();
    if (!actx) return;
    const t0 = actx.currentTime + delay;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }
  // 星星连击：音高逐级升高
  const COMBO_SCALE = [784, 880, 988, 1047, 1175, 1319, 1397, 1568];
  function sfxStar(combo) {
    const f = COMBO_SCALE[clamp((combo || 1) - 1, 0, COMBO_SCALE.length - 1)];
    tone(f, 0.13, 'sine', 0, 0.12);
    tone(f * 1.5, 0.10, 'sine', 0.05, 0.05);
  }
  function sfxBump() {
    tone(150, 0.18, 'triangle', 0, 0.22);
    tone(96, 0.22, 'square', 0.03, 0.1);
  }
  function sfxStart() {
    tone(660, 0.11, 'sine', 0, 0.1);
    tone(880, 0.16, 'sine', 0.09, 0.1);
  }
  function sfxWin() {
    [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.34, 'triangle', i * 0.12, 0.13));
  }
  function sfxPower() {
    [660, 880, 1320].forEach((f, i) => tone(f, 0.12, 'triangle', i * 0.06, 0.11));
  }
  function sfxShield() {
    tone(320, 0.12, 'square', 0, 0.09);
    tone(520, 0.22, 'sine', 0.08, 0.1);
  }
  function vibrate(ms) {
    if (state.muted) return;
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ }
  }

  // 背景音乐：极轻的五声音阶循环，只在游戏中播放
  const BGM_NOTES = [523, 659, 784, 659, 587, 784, 880, 784, 523, 659, 784, 1047];
  let bgmTimer = 0, bgmStep = 0;
  function bgmTick(dt) {
    if (state.muted || state.mode !== 'playing') return;
    bgmTimer -= dt;
    if (bgmTimer > 0) return;
    bgmTimer = 0.32;
    const f = BGM_NOTES[bgmStep % BGM_NOTES.length];
    const acc = bgmStep % 4 === 0;
    tone(f, 0.26, 'triangle', 0, acc ? 0.045 : 0.028);
    if (acc) tone(f / 2, 0.40, 'sine', 0, 0.026);
    bgmStep++;
  }

  // ---------- 汉字朗读 ----------
  let speechVoice = null;
  function pickVoice() {
    try {
      const vs = window.speechSynthesis.getVoices() || [];
      speechVoice = vs.find(v => /^zh[-_]CN/i.test(v.lang)) ||
        vs.find(v => /^zh/i.test(v.lang)) || null;
    } catch (e) { /* ignore */ }
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    window.speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }
  // 首次点击时先唤醒语音引擎（iOS 必须由用户手势触发）
  function unlockSpeech() {
    if (state.muted || !('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      u.lang = 'zh-CN';
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }
  function speakChar(ch) {
    if (!ch || state.muted || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(ch);
      u.lang = 'zh-CN';
      if (speechVoice) u.voice = speechVoice;
      u.rate = 0.82;
      u.pitch = 1.06;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }

  try {
    state.muted = localStorage.getItem('car-race-muted') === '1';
  } catch (e) { /* ignore */ }
  updateMuteUI();

  function updateMuteUI() {
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
  }
  muteBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    updateMuteUI();
    try { localStorage.setItem('car-race-muted', state.muted ? '1' : '0'); } catch (e) { /* ignore */ }
    if (!state.muted) { tone(880, 0.12, 'sine', 0, 0.12); unlockSpeech(); }
    else if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  });

  // ---------- 尺寸与布局 ----------
  function viewportSize() {
    const rect = canvas.getBoundingClientRect();
    const de = document.documentElement;
    const vv = window.visualViewport;
    const w = Math.max(
      rect.width > 1 ? rect.width : 0,
      window.innerWidth || 0,
      de ? de.clientWidth || 0 : 0,
      vv ? vv.width || 0 : 0
    );
    const h = Math.max(
      rect.height > 1 ? rect.height : 0,
      window.innerHeight || 0,
      de ? de.clientHeight || 0 : 0,
      vv ? vv.height || 0 : 0
    );
    return { w, h };
  }

  function resize() {
    const size = viewportSize();
    if (size.w < 2 || size.h < 2) return; // 布局还没就绪，等下一帧再试
    if (W === Math.round(size.w) && H === Math.round(size.h) && canvas.width > 1) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = size.w;
    H = size.h;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  function layout() {
    const brand = getBrand();

    // 竖屏手机 / 平板 / 横屏都保持合理的道路比例
    roadWidth = Math.min(W * 0.78, 700, H * 1.45);
    roadLeft = (W - roadWidth) / 2;
    roadRight = roadLeft + roadWidth;
    laneW = roadWidth / LANES;

    const ctrl = clamp(Math.min(W, H) * 0.20, 76, 112);
    car.w = clamp(roadWidth * 0.17, 46, 78);
    car.h = car.w * (brand.ratio || 2.0);
    carY = Math.max(H * 0.40, Math.min(H * 0.68, H - ctrl - 44 - car.h * 0.55));

    // 屏幕越大，速度越快，单局时长保持一致
    state.scale = clamp(H / 800, 0.72, 1.18);

    if (!initialized) {
      state.carX = (roadLeft + roadRight) / 2;
      initialized = true;
    } else if (prevWidth > 0) {
      const rel = (state.carX - prevLeft) / prevWidth;
      state.carX = roadLeft + rel * roadWidth;
    }
    state.carX = clamp(state.carX, roadLeft + car.w * 0.5 + 6, roadRight - car.w * 0.5 - 6);
    prevLeft = roadLeft;
    prevWidth = roadWidth;
    buildBgCache();
    buildDecor();
  }

  // ---------- 装饰 ----------
  function decorX(side) {
    if (side < 0) {
      const hi = roadLeft - 24;
      return hi > 12 ? rand(10, hi) : roadLeft - 34;
    }
    const lo = roadRight + 24;
    return lo < W - 10 ? rand(lo, W - 10) : roadRight + 34;
  }

  function buildDecor() {
    decor = [];
    const th = curTheme();
    const count = 12;
    for (let i = 0; i < count; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      decor.push({
        side,
        x: decorX(side),
        y: rand(-H, H),
        s: rand(0.6, 1.05),
        type: Math.random() < 0.62 ? th.plant : 'flower',
        color: th.flower[(Math.random() * th.flower.length) | 0],
        phase: rand(0, Math.PI * 2)
      });
    }
  }

  function drawTree(x, y, s) {
    ctx.fillStyle = 'rgba(30,60,30,.16)';
    ctx.beginPath();
    ctx.ellipse(x, y + 10 * s, 16 * s, 6 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#9a6b44';
    rr(x - 3 * s, y - 8 * s, 6 * s, 22 * s, 3 * s);
    ctx.fill();
    const layers = [
      [0, -14, 17, '#3fa34d'],
      [-9, -22, 12, '#4cbf5b'],
      [9, -20, 11, '#4cbf5b'],
      [0, -30, 10, '#61d56f'],
      [-3, -35, 7, '#77e284']
    ];
    for (const [dx, dy, r, c] of layers) {
      ctx.beginPath();
      ctx.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2);
      ctx.fillStyle = c;
      ctx.fill();
    }
  }

  function drawFlower(x, y, s, color, phase) {
    const sway = Math.sin(state.time * 2 + phase) * 0.06;
    const r = 4.2 * s;
    ctx.fillStyle = color;
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI * 2 / 5 + sway;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.88, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffd05a';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.72, 0, Math.PI * 2);
    ctx.fill();
  }

  // 沙漠仙人掌
  function drawCactus(x, y, s) {
    ctx.fillStyle = 'rgba(120,90,40,.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + 12 * s, 13 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5aa86a';
    rr(x - 4.5 * s, y - 22 * s, 9 * s, 34 * s, 4.5 * s);
    ctx.fill();
    ctx.fillStyle = '#4c9a5c';
    rr(x - 14 * s, y - 8 * s, 8 * s, 14 * s, 4 * s);
    ctx.fill();
    rr(x + 6 * s, y - 14 * s, 8 * s, 16 * s, 4 * s);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = Math.max(1, 1.2 * s);
    ctx.beginPath();
    ctx.moveTo(x - 1 * s, y - 18 * s);
    ctx.lineTo(x - 1 * s, y + 8 * s);
    ctx.stroke();
  }

  // 雪松
  function drawPine(x, y, s) {
    ctx.fillStyle = 'rgba(60,90,120,.14)';
    ctx.beginPath();
    ctx.ellipse(x, y + 12 * s, 14 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#9a6b44';
    rr(x - 3 * s, y - 4 * s, 6 * s, 18 * s, 2.5 * s);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      const w = (17 - i * 4) * s;
      const yy = y - (6 + i * 10) * s;
      ctx.beginPath();
      ctx.moveTo(x, yy - 14 * s);
      ctx.lineTo(x + w, yy + 6 * s);
      ctx.quadraticCurveTo(x, yy + 1 * s, x - w, yy + 6 * s);
      ctx.closePath();
      ctx.fillStyle = i % 2 ? '#2f7a58' : '#35906a';
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.beginPath();
      ctx.moveTo(x, yy - 12 * s);
      ctx.lineTo(x + w * 0.55, yy + 3 * s);
      ctx.quadraticCurveTo(x, yy - 1 * s, x - w * 0.55, yy + 3 * s);
      ctx.closePath();
      ctx.fill();
    }
  }

  // 海边棕榈
  function drawPalm(x, y, s) {
    ctx.fillStyle = 'rgba(120,90,40,.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + 12 * s, 16 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b98b52';
    ctx.lineWidth = Math.max(2, 4 * s);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y + 10 * s);
    ctx.quadraticCurveTo(x + 5 * s, y - 6 * s, x + 2 * s, y - 18 * s);
    ctx.stroke();
    ctx.fillStyle = '#3aa564';
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i - 2) * 0.62;
      ctx.beginPath();
      ctx.ellipse(x + 2 * s + Math.cos(a) * 11 * s, y - 19 * s + Math.sin(a) * 7 * s,
        10 * s, 4.2 * s, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#7d5a2e';
    ctx.beginPath();
    ctx.arc(x + 2 * s, y - 15 * s, 2.4 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDecor() {
    for (const d of decor) {
      if (d.type === 'tree') drawTree(d.x, d.y, d.s);
      else if (d.type === 'cactus') drawCactus(d.x, d.y, d.s);
      else if (d.type === 'pine') drawPine(d.x, d.y, d.s);
      else if (d.type === 'palm') drawPalm(d.x, d.y, d.s);
      else drawFlower(d.x, d.y, d.s, d.color, d.phase);
    }
  }

  // ---------- 通用绘制 ----------
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // 汉字卡片：金边奶白圆牌 + 金色光晕，替代原来的星星
  function drawChar(x, y, r, ch, phase) {
    ctx.save();
    ctx.translate(x, y);

    const halo = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 1.45);
    halo.addColorStop(0, 'rgba(255,214,66,.50)');
    halo.addColorStop(1, 'rgba(255,214,66,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(Math.sin(phase) * 0.07);
    const sc = 1 + Math.sin(phase) * 0.03;
    ctx.scale(sc, sc);

    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.24, r * 0.95, r * 0.95, 0, 0, Math.PI * 2);
    ctx.fill();

    // 牌面
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.15, 0, 0, r);
    g.addColorStop(0, '#fffdf4');
    g.addColorStop(1, '#ffeab8');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = Math.max(2, r * 0.14);
    ctx.strokeStyle = '#f5b21f';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(1, r * 0.05);
    ctx.strokeStyle = 'rgba(245,178,31,.45)';
    ctx.stroke();

    // 字
    ctx.fillStyle = '#3b2f27';
    ctx.font = '900 ' + Math.round(r * 1.28) + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, r * 0.06);
    ctx.restore();
  }

  function drawCone(x, y, s) {
    const w = s * 0.95, h = s * 1.1;
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + h * 0.43, w * 0.55, h * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#b84a22';
    rr(x - w * 0.52, y + h * 0.28, w * 1.04, h * 0.18, w * 0.08);
    ctx.fill();

    const body = () => {
      ctx.beginPath();
      ctx.moveTo(x - w * 0.40, y + h * 0.33);
      ctx.quadraticCurveTo(x - w * 0.26, y - h * 0.05, x, y - h * 0.53);
      ctx.quadraticCurveTo(x + w * 0.26, y - h * 0.05, x + w * 0.40, y + h * 0.33);
      ctx.closePath();
    };
    body();
    const g = ctx.createLinearGradient(x - w * 0.4, 0, x + w * 0.4, 0);
    g.addColorStop(0, '#ffa948');
    g.addColorStop(0.5, '#ff7a1a');
    g.addColorStop(1, '#e85f0c');
    ctx.fillStyle = g;
    ctx.fill();

    ctx.save();
    body();
    ctx.clip();
    ctx.fillStyle = '#fff8ec';
    rr(x - w, y - h * 0.15, w * 2, h * 0.21, h * 0.04);
    ctx.fill();
    ctx.restore();

    body();
    ctx.strokeStyle = 'rgba(150,55,10,.35)';
    ctx.lineWidth = Math.max(1.4, s * 0.055);
    ctx.stroke();
  }

  const ROCK_R = [1, 0.86, 0.96, 0.8, 1.02, 0.88, 0.94];
  function drawRock(x, y, s) {
    const r = s * 0.5;
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.8, r * 0.95, r * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * Math.PI * 2;
      const rad = r * ROCK_R[i];
      const px = x + Math.cos(a) * rad;
      const py = y + Math.sin(a) * rad * 0.88;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
    g.addColorStop(0, '#c3cad8');
    g.addColorStop(1, '#7b8496');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#5d6577';
    ctx.lineWidth = Math.max(1.4, s * 0.06);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(x - r * 0.24, y - r * 0.26, r * 0.30, r * 0.18, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fill();
  }

  // ---------- 道具图标 ----------
  const POWER_LABEL = { magnet: '磁铁', shield: '护盾', boost: '加速' };
  const POWER_COLOR = { magnet: '#e94d6a', shield: '#4aa8ff', boost: '#ff9f43' };

  function drawPower(x, y, s, kind, t) {
    const col = POWER_COLOR[kind] || '#ff9f43';
    const bob = Math.sin(t * 4) * 2;
    ctx.save();
    ctx.translate(x, y + bob);

    ctx.fillStyle = 'rgba(255,255,255,.30)';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.64, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fffdf6';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.50, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(2, s * 0.085);
    ctx.stroke();

    const r = s * 0.30;
    ctx.fillStyle = col;
    ctx.strokeStyle = col;
    if (kind === 'magnet') {
      ctx.lineWidth = Math.max(3, s * 0.15);
      ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.arc(0, r * 0.18, r * 0.74, Math.PI, 0);
      ctx.stroke();
      ctx.fillRect(-r * 0.92, r * 0.18, r * 0.42, r * 0.58);
      ctx.fillRect(r * 0.50, r * 0.18, r * 0.42, r * 0.58);
      ctx.fillStyle = '#e8ecf4';
      ctx.fillRect(-r * 0.92, r * 0.62, r * 0.42, r * 0.20);
      ctx.fillRect(r * 0.50, r * 0.62, r * 0.42, r * 0.20);
    } else if (kind === 'shield') {
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.92, -r * 0.56);
      ctx.lineTo(r * 0.80, r * 0.34);
      ctx.quadraticCurveTo(0, r * 1.10, -r * 0.80, r * 0.34);
      ctx.lineTo(-r * 0.92, -r * 0.56);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.92, -r * 0.56);
      ctx.lineTo(r * 0.30, -r * 0.30);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(r * 0.18, -r);
      ctx.lineTo(-r * 0.62, r * 0.12);
      ctx.lineTo(-r * 0.06, r * 0.12);
      ctx.lineTo(-r * 0.20, r);
      ctx.lineTo(r * 0.62, -r * 0.16);
      ctx.lineTo(r * 0.04, -r * 0.16);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- 车身绘制（俯视，按真实车型比例与造型） ----------
  function bodyGrad(b, w) {
    const g = ctx.createLinearGradient(-w * 0.5, 0, w * 0.5, 0);
    g.addColorStop(0, b.body2);
    g.addColorStop(0.28, b.body);
    g.addColorStop(0.72, b.body);
    g.addColorStop(1, b.body2);
    return g;
  }

  function outline(w, alpha) {
    ctx.strokeStyle = 'rgba(0,0,0,' + (alpha || 0.3) + ')';
    ctx.lineWidth = Math.max(1, w * 0.016);
    ctx.stroke();
  }

  function tire(x, y, tw, th) {
    ctx.fillStyle = '#14161b';
    rr(x - tw / 2, y - th / 2, tw, th, tw * 0.42);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    rr(x - tw * 0.10, y - th * 0.33, tw * 0.40, th * 0.66, tw * 0.20);
    ctx.fill();
  }

  function wheels4(w, h, fy, ry, spread) {
    const tw = w * 0.155, th = h * 0.105;
    for (const s of [-1, 1]) {
      tire(s * w * spread, -h * fy, tw, th);
      tire(s * w * spread, h * ry, tw, th);
    }
  }

  function glassPanel(x, y, gw, gh, r) {
    const g = ctx.createLinearGradient(0, y, 0, y + gh);
    g.addColorStop(0, 'rgba(150,190,210,.9)');
    g.addColorStop(0.45, '#2a3b48');
    g.addColorStop(1, '#141d24');
    ctx.fillStyle = g;
    rr(x, y, gw, gh, r);
    ctx.fill();
    ctx.strokeStyle = 'rgba(8,12,16,.45)';
    ctx.lineWidth = Math.max(0.7, gw * 0.018);
    ctx.stroke();
  }

  function sideMirror(s, w, h, ytop) {
    const mw = w * 0.085, mh = h * 0.030;
    ctx.fillStyle = '#26292f';
    rr(s > 0 ? w * 0.46 : -w * 0.46 - mw, ytop, mw, mh, mw * 0.35);
    ctx.fill();

    for (const yy of [0.02, 0.15, 0.28]) {
      ctx.beginPath();
      ctx.moveTo(-w * 0.395, h * yy);
      ctx.lineTo(w * 0.395, h * yy);
      ctx.stroke();
    }
    ctx.fillStyle = '#2a2e34';
    for (const s of [-1, 1]) {
      rr(s > 0 ? w * 0.395 : -w * 0.435, -h * 0.115, w * 0.04, h * 0.42, w * 0.01);
      ctx.fill();
    }

    ctx.fillStyle = '#f0f7ff';
    rr(-w * 0.32, -h * 0.497, w * 0.64, h * 0.016, w * 0.007);
    ctx.fill();
    ctx.fillStyle = '#e8352f';
    rr(-w * 0.30, h * 0.482, w * 0.60, h * 0.014, w * 0.006);
    ctx.fill();

    sideMirror(-1, w, h, -h * 0.30);
    sideMirror(1, w, h, -h * 0.30);
  }

  // 丰田 86：长引擎盖、后置座舱、短车尾
  function paint86(b, w, h) {
    wheels4(w, h, 0.315, 0.305, 0.455);

    ctx.beginPath();
    ctx.moveTo(0, -h * 0.50);
    ctx.bezierCurveTo(-w * 0.21, -h * 0.498, -w * 0.34, -h * 0.472, -w * 0.41, -h * 0.40);
    ctx.bezierCurveTo(-w * 0.46, -h * 0.31, -w * 0.45, -h * 0.12, -w * 0.465, h * 0.02);
    ctx.bezierCurveTo(-w * 0.485, h * 0.16, -w * 0.485, h * 0.33, -w * 0.46, h * 0.42);
    ctx.bezierCurveTo(-w * 0.42, h * 0.485, -w * 0.29, h * 0.50, -w * 0.20, h * 0.50);
    ctx.lineTo(w * 0.20, h * 0.50);
    ctx.bezierCurveTo(w * 0.29, h * 0.50, w * 0.42, h * 0.485, w * 0.46, h * 0.42);
    ctx.bezierCurveTo(w * 0.485, h * 0.33, w * 0.485, h * 0.16, w * 0.465, h * 0.02);
    ctx.bezierCurveTo(w * 0.45, -h * 0.12, w * 0.46, -h * 0.31, w * 0.41, -h * 0.40);
    ctx.bezierCurveTo(w * 0.34, -h * 0.472, w * 0.21, -h * 0.498, 0, -h * 0.50);
    ctx.closePath();
    ctx.fillStyle = bodyGrad(b, w);
    ctx.fill();
    outline(w);

    ctx.strokeStyle = 'rgba(0,0,0,.18)';
    ctx.lineWidth = Math.max(0.8, w * 0.011);
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.115, -h * 0.47);
      ctx.quadraticCurveTo(s * w * 0.14, -h * 0.35, s * w * 0.16, -h * 0.235);
      ctx.stroke();
    }

    glassPanel(-w * 0.27, -h * 0.225, w * 0.54, h * 0.135, w * 0.08);
    ctx.fillStyle = b.body;
    rr(-w * 0.255, -h * 0.09, w * 0.51, h * 0.185, w * 0.07);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.12)';
    ctx.lineWidth = Math.max(0.8, w * 0.01);
    ctx.stroke();
    glassPanel(-w * 0.235, h * 0.095, w * 0.47, h * 0.085, w * 0.045);

    ctx.fillStyle = '#1b262f';
    for (const s of [-1, 1]) {
      rr(s > 0 ? w * 0.255 : -w * 0.30, -h * 0.075, w * 0.045, h * 0.145, w * 0.02);
      ctx.fill();
    }

    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * w * 0.285, -h * 0.452);
      ctx.rotate(s * 0.38);
      lamp(-w * 0.085, -h * 0.010, w * 0.17, h * 0.020, '#eaf4ff');
      ctx.restore();
    }

    ctx.fillStyle = '#1a1d22';
    rr(-w * 0.42, h * 0.36, w * 0.84, h * 0.026, w * 0.01);
    ctx.fill();
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#d8292f';
      rr(s > 0 ? w * 0.235 : -w * 0.375, h * 0.425, w * 0.14, h * 0.028, w * 0.01);
      ctx.fill();
    }
    ctx.fillStyle = '#3a3d43';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(s * w * 0.10, h * 0.472, w * 0.028, 0, Math.PI * 2);
      ctx.fill();
    }

    sideMirror(-1, w, h, -h * 0.21);
    sideMirror(1, w, h, -h * 0.21);
  }

  const PAINTERS = {
    ferrari: paintFerrari,
    lamborghini: paintLamborghini,
    mercedes: paintGClass,
    bmw: paintI8,
    audi: paintR8,
    vw: paintBeetle,
    tesla: paintCybertruck,
    toyota: paint86
  };

  function drawCar() {
    const b = getBrand();
    const w = car.w, h = car.h;
    const bob = Math.sin(state.time * 7) * 0.9 + (state.mode === 'ready' ? Math.sin(state.time * 2) * 1.6 : 0);

    ctx.save();
    ctx.translate(state.carX, carY + bob);

    ctx.fillStyle = 'rgba(0,0,0,.20)';
    ctx.beginPath();
    ctx.ellipse(0, h * 0.02, w * 0.58, h * 0.50, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(state.tilt * 0.12);
    if (state.invuln > 0 && Math.floor(state.time * 20) % 2 === 0) ctx.globalAlpha = 0.5;

    (PAINTERS[b.id] || paintFerrari)(b, w, h);

    // 引擎盖上的真实车标
    const img = logoImgs[b.id];
    if (img && img.naturalWidth) {
      const spec = badgeSpec(b.id);
      const dw = w * spec.w;
      const dh = dw * img.naturalHeight / img.naturalWidth;
      if (spec.glow) {
        // 深色车漆上给银色车标垫一层柔光，避免看不清
        const gr = ctx.createRadialGradient(0, h * spec.y, 0, 0, h * spec.y, dw * 0.85);
        gr.addColorStop(0, 'rgba(255,255,255,.26)');
        gr.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(0, h * spec.y, dw * 0.85, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.drawImage(img, -dw / 2, h * spec.y - dh / 2, dw, dh);
    }

    ctx.restore();
  }

  // ---------- 粒子 / 提示 ----------
  const CONFETTI_COLORS = ['#ffd642', '#ff6b6b', '#6bd5ff', '#8be36b', '#c58bff', '#ff9f43'];

  function burst(x, y, n, colors, gravity = 620) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const sp = rand(60, 280);
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 60,
        g: gravity,
        rot: rand(0, Math.PI * 2),
        vr: rand(-9, 9),
        size: rand(3, 7),
        color: colors[(Math.random() * colors.length) | 0],
        life: rand(0.55, 1.25),
        ttl: 1.25,
        star: Math.random() < 0.28
      });
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const alpha = clamp(p.life / p.ttl, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.star) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rad = i % 2 ? p.size * 0.45 : p.size;
          const a = -Math.PI / 2 + i * Math.PI / 5;
          if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(-p.size * 0.5, -p.size * 0.35, p.size, p.size * 0.7);
      }
      ctx.restore();
    }
  }

  function drawToasts() {
    for (const t of toasts) {
      const alpha = clamp(t.life / t.ttl, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = '900 ' + Math.round(car.w * 0.5) + 'px system-ui, -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    }
  }

  // ---------- 背景（静态部分离屏缓存，只画一次） ----------
  let bgCache = null;

  function buildBgCache() {
    const th = curTheme();
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * DPR));
    c.height = Math.max(1, Math.round(H * DPR));
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    const gg = g.createLinearGradient(0, 0, 0, H);
    gg.addColorStop(0, th.grass[0]);
    gg.addColorStop(1, th.grass[1]);
    g.fillStyle = gg;
    g.fillRect(0, 0, W, H);

    g.fillStyle = th.road;
    g.fillRect(roadLeft, 0, roadWidth, H);

    const eg = g.createLinearGradient(roadLeft, 0, roadRight, 0);
    eg.addColorStop(0, th.edge);
    eg.addColorStop(0.16, 'rgba(0,0,0,0)');
    eg.addColorStop(0.84, 'rgba(0,0,0,0)');
    eg.addColorStop(1, th.edge);
    g.fillStyle = eg;
    g.fillRect(roadLeft, 0, roadWidth, H);

    g.fillStyle = 'rgba(255,255,255,.55)';
    g.fillRect(roadLeft + 2, 0, 3, H);
    g.fillRect(roadRight - 5, 0, 3, H);

    bgCache = c;
  }

  function drawGrass() {
    const th = curTheme();
    if (bgCache) ctx.drawImage(bgCache, 0, 0, W, H);
    else { ctx.fillStyle = th.grass[0]; ctx.fillRect(0, 0, W, H); }

    const period = 140;
    const start = (grassOffset % period) - period;
    const lw = Math.max(0, roadLeft - 14);
    const rw = Math.max(0, W - roadRight - 14);
    ctx.fillStyle = th.stripe;
    for (let y = start; y < H + period; y += period) {
      if (lw > 0) ctx.fillRect(0, y, lw, period / 2);
      if (rw > 0) ctx.fillRect(roadRight + 14, y, rw, period / 2);
    }
  }

  function drawCurb(x, colors) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, -40, 14, H + 80);
    ctx.clip();
    const start = (curbOffset % 56) - 56 - 40;
    for (let y = start; y < H + 80; y += 56) {
      ctx.fillStyle = colors[0];
      ctx.fillRect(x, y, 14, 28);
      ctx.fillStyle = colors[1];
      ctx.fillRect(x, y + 28, 14, 28);
    }
    ctx.restore();
  }

  function drawRoad() {
    const th = curTheme();
    drawCurb(roadLeft - 14, th.curb);
    drawCurb(roadRight, th.curb);

    const dashH = 34, gap = 38, period = dashH + gap;
    const start = (dashOffset % period) - period;
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    for (let i = 1; i < LANES; i++) {
      const x = roadLeft + i * laneW;
      for (let y = start; y < H + period; y += period) {
        rr(x - 4, y, 8, dashH, 4);
        ctx.fill();
      }
    }
  }

  // ---------- 游戏逻辑 ----------
  const POWER_KINDS = ['magnet', 'shield', 'boost'];

  function spawnObject() {
    const lane = Math.floor(Math.random() * LANES);
    const x = roadLeft + (lane + 0.5) * laneW + rand(-laneW * 0.16, laneW * 0.16);

    // 跑过一段路后开始出现道具
    if (state.distance > 900 && Math.random() < 0.10) {
      objects.push({
        type: 'power',
        kind: POWER_KINDS[(Math.random() * POWER_KINDS.length) | 0],
        x,
        y: -70,
        s: Math.max(34, car.w * 0.72),
        phase: rand(0, Math.PI * 2),
        dead: false
      });
      return;
    }

    if (Math.random() < 0.66) {
      state.spawnStars++;
      objects.push({
        type: 'star',
        ch: nextChar(),
        x,
        y: -70,
        r: Math.max(15, car.w * 0.40),
        rot: rand(0, Math.PI * 2),
        phase: rand(0, Math.PI * 2),
        dead: false
      });
    } else {
      objects.push({
        type: Math.random() < 0.5 ? 'cone' : 'rock',
        x,
        y: -70,
        s: Math.max(28, car.w * 0.66),
        dead: false
      });
    }
  }

  function collect(o) {
    o.dead = true;
    state.stars++;
    state.combo = Math.min(state.combo + 1, 8);
    state.comboT = 1.1;
    starsEl.textContent = String(state.stars);
    burst(o.x, o.y, 12, ['#ffd642', '#fff3a0', '#ffb347'], 320);
    toasts.push({ x: o.x, y: o.y - 8, text: o.ch, life: 0.9, ttl: 0.9, color: '#f5a623' });
    sfxStar(state.combo);
    speakChar(o.ch);
    vibrate(12);
  }

  function grabPower(o) {
    o.dead = true;
    const col = POWER_COLOR[o.kind];
    if (o.kind === 'magnet') state.magnet = 6;
    else if (o.kind === 'shield') state.shield = 9;
    else state.boost = 3.2;
    burst(o.x, o.y, 16, [col, '#ffffff', '#ffd642'], 380);
    toasts.push({ x: o.x, y: o.y - 10, text: POWER_LABEL[o.kind] + '！', life: 1.0, ttl: 1.0, color: col });
    sfxPower();
    vibrate(18);
    updateEffects();
  }

  function bump(o) {
    if (state.invuln > 0) return;
    o.dead = true;
    // 护盾：撞一下不会减速，护盾消失
    if (state.shield > 0) {
      state.shield = 0;
      state.shake = 6;
      burst(o.x, o.y, 18, ['#4aa8ff', '#bfe4ff', '#ffffff'], 520);
      toasts.push({ x: o.x, y: o.y - 10, text: '护盾挡住啦！', life: 0.9, ttl: 0.9, color: '#2f86d6' });
      sfxShield();
      vibrate(20);
      updateEffects();
      return;
    }
    state.invuln = 0.95;
    state.shake = 11;
    state.carVX += (state.carX < o.x ? -1 : 1) * 150;
    state.speed *= 0.55;
    state.combo = 0;
    burst(o.x, o.y, 14, ['#d5dbe8', '#9aa3b5', '#ffd642'], 500);
    toasts.push({ x: o.x, y: o.y - 10, text: '呀！', life: 0.75, ttl: 0.75, color: '#ff6b6b' });
    sfxBump();
    vibrate(30);
  }

  function update(dt) {
    if (state.mode === 'paused') return;
    state.time += dt;

    const playing = state.mode === 'playing';
    const sp = playing ? state.speed : (state.mode === 'ready' ? 85 : 45);

    // 道具计时
    if (state.magnet > 0) state.magnet = Math.max(0, state.magnet - dt);
    if (state.shield > 0) state.shield = Math.max(0, state.shield - dt);
    if (state.boost > 0) state.boost = Math.max(0, state.boost - dt);
    if (state.comboT > 0) {
      state.comboT -= dt;
      if (state.comboT <= 0) state.combo = 0;
    }
    updateEffects();

    // 速度与里程（加速道具期间更快）
    if (playing) {
      const prog = Math.min(1, state.distance / state.goal);
      const boostK = state.boost > 0 ? 1.35 : 1;
      const target = (200 + prog * 95) * state.scale * boostK;
      state.speed = lerp(state.speed, target, Math.min(1, dt * 2.2));
      state.distance += state.speed * dt;
      bgmTick(dt);
    }

    // 滚动
    grassOffset += sp * dt * 0.35;
    curbOffset += sp * dt;
    dashOffset += sp * dt;

    // 转向
    if (playing) {
      let steer = btnDir || keyDir;
      if (!steer && dragTarget !== null) {
        const dx = dragTarget - state.carX;
        if (Math.abs(dx) < 2) steer = 0;
        else steer = Math.sign(dx) * Math.min(1, Math.abs(dx) / 30);
      }
      const maxVX = car.w * 8;
      state.carVX = lerp(state.carVX, steer * maxVX, Math.min(1, dt * 11));
      state.carX += state.carVX * dt;
      const pad = car.w * 0.5 + 7;
      if (state.carX < roadLeft + pad) {
        state.carX = roadLeft + pad;
        if (state.carVX < 0) state.carVX = 0;
      }
      if (state.carX > roadRight - pad) {
        state.carX = roadRight - pad;
        if (state.carVX > 0) state.carVX = 0;
      }
      state.tilt = lerp(state.tilt, clamp(steer, -1, 1), Math.min(1, dt * 9));

      // 生成
      if (state.distance > 380) {
        state.spawnAcc += state.speed * dt;
        const spacing = 215 * state.scale;
        if (state.spawnAcc > spacing) {
          state.spawnAcc -= spacing;
          spawnObject();
        }
      }

      // 物体
      for (const o of objects) {
        o.y += state.speed * dt;
        if (o.type === 'star') o.rot += dt * 1.6;
        // 磁铁：把附近的星星吸过来
        if (state.magnet > 0 && o.type === 'star') {
          const dx = state.carX - o.x, dy = carY - o.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < Math.min(W, H) * 0.52) {
            const pull = 320 * dt;
            o.x += dx / d * pull;
            o.y += dy / d * pull;
          }
        }
        if (o.y > H + 90) o.dead = true;
      }

      // 碰撞
      const halfW = car.w * 0.42;
      const halfH = car.h * 0.42;
      for (const o of objects) {
        if (o.dead) continue;
        const orad = o.type === 'power' ? o.s * 0.46 : (o.type === 'star' ? o.r * 0.95 : o.s * 0.36);
        if (Math.abs(o.x - state.carX) < halfW + orad &&
            Math.abs(o.y - carY) < halfH + orad) {
          if (o.type === 'star') collect(o);
          else if (o.type === 'power') grabPower(o);
          else bump(o);
        }
      }
      objects = objects.filter(o => !o.dead);
      state.invuln = Math.max(0, state.invuln - dt);
      state.shake = Math.max(0, state.shake - dt * 45);

      const prog = Math.min(1, state.distance / state.goal);
      barEl.style.width = (prog * 100).toFixed(1) + '%';
      if (state.distance >= state.goal) finishGame();
    } else {
      state.tilt = lerp(state.tilt, 0, Math.min(1, dt * 4));
      state.invuln = Math.max(0, state.invuln - dt);
      state.shake = Math.max(0, state.shake - dt * 45);
    }

    // 装饰滚动
    for (const d of decor) {
      d.y += sp * dt;
      if (d.y > H + 60) {
        d.y = -60;
        d.side = Math.random() < 0.5 ? -1 : 1;
        d.x = decorX(d.side);
        d.s = rand(0.6, 1.05);
        const th = curTheme();
        d.type = Math.random() < 0.62 ? th.plant : 'flower';
        d.color = th.flower[(Math.random() * th.flower.length) | 0];
      }
    }

    // 粒子
    for (const p of particles) {
      p.life -= dt;
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.99;
      p.rot += p.vr * dt;
    }
    particles = particles.filter(p => p.life > 0 && p.y < H + 80);

    // 提示文字
    for (const t of toasts) {
      t.life -= dt;
      t.y -= dt * 42;
    }
    toasts = toasts.filter(t => t.life > 0);
  }

  function draw() {
    ctx.save();
    if (state.shake > 0.5) {
      ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
    }
    drawGrass();
    drawRoad();
    drawDecor();

    for (const o of objects) {
      if (o.type === 'star') {
        drawChar(o.x, o.y + Math.sin(state.time * 3 + o.phase) * 3, o.r, o.ch, state.time * 2.2 + o.phase);
      } else if (o.type === 'power') {
        drawPower(o.x, o.y, o.s, o.kind, state.time + o.phase);
      } else if (o.type === 'cone') {
        drawCone(o.x, o.y, o.s);
      } else {
        drawRock(o.x, o.y, o.s);
      }
    }

    // 道具光环
    if (state.shield > 0 || state.magnet > 0) {
      ctx.save();
      const cy = carY + Math.sin(state.time * 7) * 0.9;
      if (state.shield > 0) {
        ctx.strokeStyle = 'rgba(74,168,255,' + (0.45 + Math.sin(state.time * 6) * 0.18).toFixed(2) + ')';
        ctx.fillStyle = 'rgba(74,168,255,.10)';
        ctx.lineWidth = Math.max(2, car.w * 0.05);
        ctx.beginPath();
        ctx.ellipse(state.carX, cy, car.w * 0.92, car.h * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      if (state.magnet > 0) {
        ctx.strokeStyle = 'rgba(233,77,106,' + (0.30 + Math.sin(state.time * 5) * 0.12).toFixed(2) + ')';
        ctx.lineWidth = Math.max(2, car.w * 0.045);
        ctx.setLineDash([car.w * 0.22, car.w * 0.18]);
        ctx.beginPath();
        ctx.arc(state.carX, cy, Math.min(W, H) * 0.52, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    }

    drawCar();
    drawParticles();
    drawToasts();
    ctx.restore();

    if (state.invuln > 0) {
      ctx.fillStyle = 'rgba(255,90,90,' + (0.16 * state.invuln / 0.95).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- 车库 ----------
  function renderGarage() {
    garageEl.innerHTML = BRANDS.map(b => (
      '<button class="car-card' + (b.id === state.brandId ? ' on' : '') + '" data-id="' + b.id +
        '" type="button" aria-pressed="' + (b.id === state.brandId) + '">' +
        '<img class="car-logo" src="' + b.logo + '" alt="">' +
        '<span class="car-brand">' + b.brand + '</span>' +
        '<span class="car-model">' + b.model + '</span>' +
      '</button>'
    )).join('');
  }

  garageEl.addEventListener('click', (e) => {
    const card = e.target.closest('.car-card');
    if (!card) return;
    const id = card.dataset.id;
    if (!brandById[id] || id === state.brandId) return;
    state.brandId = id;
    try { localStorage.setItem('car-race-brand', id); } catch (err) { /* ignore */ }
    renderGarage();
    layout();
    tone(520, 0.09, 'triangle', 0, 0.1);
    tone(700, 0.12, 'triangle', 0.07, 0.09);
  });

  // ---------- 道具状态条 ----------
  function updateEffects() {
    const parts = [];
    if (state.magnet > 0) parts.push(['🧲', '磁铁', state.magnet]);
    if (state.shield > 0) parts.push(['🛡️', '护盾', state.shield]);
    if (state.boost > 0) parts.push(['🚀', '加速', state.boost]);
    const sig = parts.map(p => p[1] + Math.ceil(p[2])).join('|');
    if (sig === state.fxSig) return;
    state.fxSig = sig;
    effectsEl.innerHTML = parts.map(p =>
      '<span class="fx">' + p[0] + ' ' + p[1] + ' ' + Math.ceil(p[2]) + 's</span>').join('');
  }

  // ---------- 屏幕常亮 ----------
  let wakeLock = null;
  async function requestWake() {
    try {
      if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { /* 部分浏览器不支持，忽略 */ }
  }
  function releaseWake() {
    if (!wakeLock) return;
    try { wakeLock.release(); } catch (e) { /* ignore */ }
    wakeLock = null;
  }

  // ---------- 成绩卡 ----------
  function rrOn(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  function drawCardStar(g, cx, cy, r, filled) {
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? r * 0.46 : r;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const px = cx + Math.cos(a) * rad;
      const py = cy + Math.sin(a) * rad;
      if (i === 0) g.moveTo(px, py);
      else g.lineTo(px, py);
    }
    g.closePath();
    g.fillStyle = filled ? '#ffc32b' : '#e6e9f0';
    g.fill();
    g.lineWidth = 5;
    g.strokeStyle = filled ? '#e39a12' : '#d3d7e2';
    g.stroke();
  }

  function buildScoreCard(rating) {
    const th = curTheme();
    const b = getBrand();
    const bw = 600, bh = 760;
    const c = document.createElement('canvas');
    c.width = bw;
    c.height = bh;
    const g = c.getContext('2d');

    const bg = g.createLinearGradient(0, 0, 0, bh);
    bg.addColorStop(0, th.grass[0]);
    bg.addColorStop(1, th.grass[1]);
    g.fillStyle = bg;
    g.fillRect(0, 0, bw, bh);

    g.fillStyle = '#fffaf0';
    rrOn(g, 40, 40, bw - 80, bh - 80, 40);
    g.fill();

    g.textAlign = 'center';
    g.fillStyle = '#3a3d5c';
    g.font = '900 40px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText('小车大冒险', bw / 2, 118);

    g.fillStyle = '#8a90a6';
    g.font = '800 24px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText('第 ' + state.level + ' 关 · ' + th.name, bw / 2, 162);

    for (let i = 0; i < 3; i++) {
      drawCardStar(g, bw / 2 + (i - 1) * 128, 262, 52, i < rating);
    }

    g.fillStyle = '#4a3b1c';
    g.font = '900 68px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText(String(state.stars), bw / 2, 392);
    g.fillStyle = '#8a90a6';
    g.font = '700 22px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText('个汉字', bw / 2, 424);

    const img = logoImgs[b.id];
    if (img && img.naturalWidth) {
      const mw = 140, k = Math.min(mw / img.naturalWidth, 140 / img.naturalHeight);
      const dw = img.naturalWidth * k, dh = img.naturalHeight * k;
      g.drawImage(img, bw / 2 - dw / 2, 462, dw, dh);
    }

    g.fillStyle = '#3a3d5c';
    g.font = '900 32px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText(b.brand + ' ' + b.model, bw / 2, 660);

    g.fillStyle = '#b3b8c9';
    g.font = '700 18px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText('家庭小游戏 · 个人非商业使用', bw / 2, 692);

    const url = c.toDataURL('image/png');
    cardImgEl.src = url;
    saveCardEl.href = url;
    saveCardEl.download = 'car-race-' + state.level + '-level.png';
    cardWrapEl.classList.add('on');
  }

  // ---------- 关卡信息 ----------
  function updateLevelChip() {
    const th = curTheme();
    const best = bestStars[state.level] || 0;
    levelChipEl.innerHTML = '第 <b>' + state.level + '</b> 关 · ' + th.name +
      (best ? '　最好 ' + '★'.repeat(best) : '');
  }

  // ---------- 流程 ----------
  function startGame() {
    ensureAudio();
    unlockSpeech();
    state.mode = 'playing';
    state.stars = 0;
    state.distance = 0;
    state.speed = 0;
    state.combo = 0;
    state.comboT = 0;
    state.magnet = 0;
    state.shield = 0;
    state.boost = 0;
    state.fxSig = '';
    state.spawnStars = 0;
    state.goal = Math.round(GOAL * state.scale * (1 + (state.level - 1) * 0.12));
    layout();                       // 关卡主题可能变化，重建背景与装饰
    state.carX = (roadLeft + roadRight) / 2;
    state.carVX = 0;
    state.tilt = 0;
    state.invuln = 0;
    state.shake = 0;
    state.spawnAcc = 0;
    objects = [];
    particles = [];
    toasts = [];
    bgmTimer = 0;
    bgmStep = 0;
    starsEl.textContent = '0';
    barEl.style.width = '0%';
    effectsEl.innerHTML = '';
    ratingEl.querySelectorAll('span').forEach(s => s.classList.remove('on'));
    cardWrapEl.classList.remove('on');
    startScreen.classList.add('hidden');
    finishScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    hudEl.classList.remove('hidden');
    progressEl.classList.remove('hidden');
    requestWake();
    sfxStart();
  }

  function finishGame() {
    if (state.mode !== 'playing') return;
    state.mode = 'finish';
    releaseWake();
    state.fxSig = '';
    effectsEl.innerHTML = '';

    // 按本局实际出现的星星数换算评价，长关卡与短关卡都公平
    const total = Math.max(1, state.spawnStars);
    const rating = state.stars >= total * 0.75 ? 3 :
      state.stars >= total * 0.55 ? 2 :
      state.stars >= total * 0.30 ? 1 : 0;
    state.rating = rating;
    if (rating > (bestStars[state.level] || 0)) {
      bestStars[state.level] = rating;
      saveProgress();
    }

    sfxWin();
    burst(W / 2, H * 0.42, 90, CONFETTI_COLORS, 700);
    barEl.style.width = '100%';
    const b = getBrand();
    finishStarsEl.textContent = String(state.stars);
    finishModelEl.textContent = b.brand + ' ' + b.model;
    finishLogoEl.src = b.logo;

    const spans = ratingEl.querySelectorAll('span');
    spans.forEach(s => s.classList.remove('on'));
    for (let i = 0; i < rating; i++) {
      setTimeout(() => spans[i] && spans[i].classList.add('on'), 300 + i * 200);
    }

    buildScoreCard(rating);
    updateLevelChip();

    setTimeout(() => {
      if (state.mode === 'finish') finishScreen.classList.remove('hidden');
    }, 650);
  }

  function nextLevel() {
    state.level = Math.min(99, state.level + 1);
    saveProgress();
    startGame();
  }

  function goGarage() {
    state.mode = 'ready';
    state.stars = 0;
    state.distance = 0;
    state.speed = 0;
    state.combo = 0;
    state.comboT = 0;
    state.magnet = 0;
    state.shield = 0;
    state.boost = 0;
    state.fxSig = '';
    state.invuln = 0;
    state.shake = 0;
    objects = [];
    particles = [];
    toasts = [];
    releaseWake();
    starsEl.textContent = '0';
    barEl.style.width = '0%';
    effectsEl.innerHTML = '';
    finishScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    hudEl.classList.add('hidden');
    progressEl.classList.add('hidden');
    updateLevelChip();
    renderGarage();
    layout();
  }

  // ---------- 暂停 ----------
  function pauseGame() {
    if (state.mode !== 'playing') return;
    state.mode = 'paused';
    btnDir = 0;
    keyDir = 0;
    dragTarget = null;
    dragId = null;
    pauseScreen.classList.remove('hidden');
    releaseWake();
  }

  function resumeGame() {
    if (state.mode !== 'paused') return;
    state.mode = 'playing';
    pauseScreen.classList.add('hidden');
    last = performance.now();
    requestWake();
  }

  // ---------- 交互 ----------
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');

  function bindHold(el, dir) {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      btnDir = dir;
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    const release = (e) => {
      e.preventDefault();
      if (btnDir === dir) btnDir = 0;
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  bindHold(leftBtn, -1);
  bindHold(rightBtn, 1);

  function updateDrag(x) {
    if (state.mode !== 'playing') return;
    dragTarget = clamp(x, roadLeft + car.w * 0.5, roadRight - car.w * 0.5);
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (state.mode !== 'playing') return;
    dragId = e.pointerId;
    updateDrag(e.clientX);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (dragId === e.pointerId) updateDrag(e.clientX);
  });
  const endDrag = (e) => {
    if (dragId === e.pointerId) {
      dragId = null;
      dragTarget = null;
    }
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      keyDir = -1;
      e.preventDefault();
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keyDir = 1;
      e.preventDefault();
    } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state.mode === 'playing') pauseGame();
      else if (state.mode === 'paused') resumeGame();
      e.preventDefault();
    } else if (e.key === ' ' || e.key === 'Enter') {
      if (state.mode === 'paused') resumeGame();
      else if (state.mode === 'ready' || state.mode === 'finish') startGame();
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' ||
        e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keyDir = 0;
    }
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
  document.getElementById('changeBtn').addEventListener('click', goGarage);
  nextBtn.addEventListener('click', nextLevel);
  pauseBtn.addEventListener('click', pauseGame);
  resumeBtn.addEventListener('click', resumeGame);
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // 长按 2 秒才回车库，防小孩误触
  let quitTimer = null;
  const startHold = (e) => {
    e.preventDefault();
    try { quitBtn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    quitBtn.classList.add('holding');
    if (quitTimer) clearTimeout(quitTimer);
    quitTimer = setTimeout(() => {
      quitTimer = null;
      quitBtn.classList.remove('holding');
      goGarage();
    }, 2000);
  };
  const endHold = () => {
    if (quitTimer) { clearTimeout(quitTimer); quitTimer = null; }
    quitBtn.classList.remove('holding');
  };
  quitBtn.addEventListener('pointerdown', startHold);
  quitBtn.addEventListener('pointerup', endHold);
  quitBtn.addEventListener('pointercancel', endHold);
  quitBtn.addEventListener('lostpointercapture', endHold);

  // ---------- 主循环 ----------
  let last = performance.now();
  function frame(now) {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if ((canvas.width <= 1 || canvas.height <= 1) ||
        (cw > 1 && ch > 1 && (Math.abs(cw - W) > 1 || Math.abs(ch - H) > 1))) {
      resize();
    }
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  document.addEventListener('visibilitychange', () => {
    last = performance.now();
    if (document.hidden && state.mode === 'playing') pauseGame();
    if (!document.hidden && state.mode === 'playing') requestWake();
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.ResizeObserver) {
    new ResizeObserver(() => resize()).observe(document.getElementById('stage'));
  }

  renderGarage();
  updateLevelChip();
  resize();
  requestAnimationFrame(frame);

  // 注册 Service Worker，支持离线与添加到主屏幕
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 隐私模式等场景忽略 */ });
    });
  }
})();
</script>
</body>
</html>
