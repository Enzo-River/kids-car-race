      lamp(-w * 0.09, -h * 0.011, w * 0.18, h * 0.022, '#eaf6ff');
      ctx.restore();
    }

    ctx.fillStyle = '#191c20';
    rr(-w * 0.31, h * 0.442, w * 0.62, h * 0.032, w * 0.01);
    ctx.fill();
    ctx.fillStyle = '#e8342f';
    rr(-w * 0.30, h * 0.455, w * 0.60, h * 0.016, w * 0.006);
    ctx.fill();
    ctx.fillStyle = '#3a3d43';
    for (const s of [-1, 1]) {
      rr(s > 0 ? w * 0.06 : -w * 0.16, h * 0.478, w * 0.10, h * 0.014, w * 0.006);
      ctx.fill();
    }

    sideMirror(-1, w, h, -h * 0.22);
    sideMirror(1, w, h, -h * 0.22);
  }

  // 大众甲壳虫：圆润车顶、圆形翼子板、圆大灯、镀铬保险杠
  function paintBeetle(b, w, h) {
    ctx.fillStyle = b.body2;
    for (const s of [-1, 1]) {
      for (const yy of [-0.30, 0.295]) {
        ctx.beginPath();
        ctx.ellipse(s * w * 0.415, h * yy, w * 0.155, h * 0.128, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    wheels4(w, h, 0.30, 0.295, 0.445);

    rr(-w * 0.475, -h * 0.487, w * 0.95, h * 0.974, w * 0.40);
    ctx.fillStyle = bodyGrad(b, w);
    ctx.fill();
    outline(w);

    glassPanel(-w * 0.30, -h * 0.245, w * 0.60, h * 0.155, w * 0.26);
    ctx.fillStyle = b.body;
    rr(-w * 0.31, -h * 0.10, w * 0.62, h * 0.255, w * 0.28);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.12)';
    ctx.lineWidth = Math.max(0.8, w * 0.01);
    ctx.stroke();
    glassPanel(-w * 0.28, h * 0.155, w * 0.56, h * 0.10, w * 0.06);

    for (const s of [-1, 1]) {
      ctx.fillStyle = '#f7f5ec';
      ctx.beginPath();
      ctx.arc(s * w * 0.30, -h * 0.425, w * 0.062, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.lineWidth = Math.max(0.7, w * 0.009);
      ctx.stroke();
    }

    ctx.fillStyle = '#cfd3d8';
    rr(-w * 0.40, -h * 0.495, w * 0.80, h * 0.018, w * 0.008);
    ctx.fill();
    rr(-w * 0.40, h * 0.477, w * 0.80, h * 0.018, w * 0.008);
    ctx.fill();

    ctx.fillStyle = '#e8342f';
    for (const s of [-1, 1]) {
      rr(s > 0 ? w * 0.24 : -w * 0.38, h * 0.452, w * 0.14, h * 0.024, w * 0.01);
      ctx.fill();
    }

    sideMirror(-1, w, h, -h * 0.235);
    sideMirror(1, w, h, -h * 0.235);
  }

  // 特斯拉 Cybertruck：折面不锈钢车身、贯穿灯带、开放式货斗
  function paintCybertruck(b, w, h) {
    const tw = w * 0.16, th = h * 0.105;
    for (const s of [-1, 1]) {
      tire(s * w * 0.455, -h * 0.315, tw, th);
      tire(s * w * 0.455, h * 0.30, tw, th);
    }

    ctx.beginPath();
    ctx.moveTo(-w * 0.335, -h * 0.50);
    ctx.lineTo(w * 0.335, -h * 0.50);
    ctx.lineTo(w * 0.45, -h * 0.355);
    ctx.lineTo(w * 0.49, -h * 0.115);
    ctx.lineTo(w * 0.49, h * 0.30);
    ctx.lineTo(w * 0.43, h * 0.50);
    ctx.lineTo(-w * 0.43, h * 0.50);
    ctx.lineTo(-w * 0.49, h * 0.30);
    ctx.lineTo(-w * 0.49, -h * 0.115);
    ctx.lineTo(-w * 0.45, -h * 0.355);
    ctx.closePath();
    const g = ctx.createLinearGradient(-w * 0.5, -h * 0.5, w * 0.5, h * 0.5);
    g.addColorStop(0, '#d7dce1');
    g.addColorStop(0.45, '#b2b9c1');
    g.addColorStop(1, '#8b929b');
    ctx.fillStyle = g;
    ctx.fill();
    outline(w, 0.38);

    ctx.strokeStyle = 'rgba(40,46,54,.35)';
    ctx.lineWidth = Math.max(0.8, w * 0.012);
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.335, -h * 0.50);
      ctx.lineTo(s * w * 0.49, -h * 0.115);
      ctx.lineTo(s * w * 0.49, h * 0.30);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(-w * 0.49, -h * 0.115);
    ctx.lineTo(w * 0.49, -h * 0.115);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-w * 0.355, -h * 0.345);
    ctx.lineTo(w * 0.355, -h * 0.345);
    ctx.lineTo(w * 0.30, -h * 0.135);
    ctx.lineTo(-w * 0.30, -h * 0.135);
    ctx.closePath();
    ctx.fillStyle = '#1c2730';
    ctx.fill();
    ctx.strokeStyle = 'rgba(220,235,245,.35)';
    ctx.stroke();

    ctx.fillStyle = 'rgba(60,66,74,.16)';
    rr(-w * 0.40, -h * 0.115, w * 0.80, h * 0.42, w * 0.02);
    ctx.fill();
    ctx.strokeStyle = 'rgba(45,50,58,.45)';
    ctx.lineWidth = Math.max(0.8, w * 0.012);
    for (const yy of [0.02, 0.15, 0.28]) {
      ctx.beginPath();
      ctx.moveTo(-w * 0.395, h * yy);
      ctx.lineTo(w * 0.395, h * yy);
      ctx.stroke();
    }
    ctx.fillStyle = '#2a2e34';
    for (const s of [-1, 1]) {
      rr(s > 0 ? w * 0.395 : -w * 0.435, -h * 0.115, w * 0.04, h * 0.42, w * 0.01);
      ctx.fill();
    }

    ctx.fillStyle = '#f0f7ff';
    rr(-w * 0.32, -h * 0.497, w * 0.64, h * 0.016, w * 0.007);
    ctx.fill();
    ctx.fillStyle = '#e8352f';
    rr(-w * 0.30, h * 0.482, w * 0.60, h * 0.014, w * 0.006);
    ctx.fill();

    sideMirror(-1, w, h, -h * 0.30);
    sideMirror(1, w, h, -h * 0.30);
  }

  // 丰田 86：长引擎盖、后置座舱、短车尾
  function paint86(b, w, h) {
    wheels4(w, h, 0.315, 0.305, 0.455);

    ctx.beginPath();
    ctx.moveTo(0, -h * 0.50);
    ctx.bezierCurveTo(-w * 0.21, -h * 0.498, -w * 0.34, -h * 0.472, -w * 0.41, -h * 0.40);
    ctx.bezierCurveTo(-w * 0.46, -h * 0.31, -w * 0.45, -h * 0.12, -w * 0.465, h * 0.02);
    ctx.bezierCurveTo(-w * 0.485, h * 0.16, -w * 0.485, h * 0.33, -w * 0.46, h * 0.42);
    ctx.bezierCurveTo(-w * 0.42, h * 0.485, -w * 0.29, h * 0.50, -w * 0.20, h * 0.50);
    ctx.lineTo(w * 0.20, h * 0.50);
    ctx.bezierCurveTo(w * 0.29, h * 0.50, w * 0.42, h * 0.485, w * 0.46, h * 0.42);
    ctx.bezierCurveTo(w * 0.485, h * 0.33, w * 0.485, h * 0.16, w * 0.465, h * 0.02);
    ctx.bezierCurveTo(w * 0.45, -h * 0.12, w * 0.46, -h * 0.31, w * 0.41, -h * 0.40);
    ctx.bezierCurveTo(w * 0.34, -h * 0.472, w * 0.21, -h * 0.498, 0, -h * 0.50);
    ctx.closePath();
    ctx.fillStyle = bodyGrad(b, w);
    ctx.fill();
    outline(w);

    ctx.strokeStyle = 'rgba(0,0,0,.18)';
    ctx.lineWidth = Math.max(0.8, w * 0.011);
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.115, -h * 0.47);
      ctx.quadraticCurveTo(s * w * 0.14, -h * 0.35, s * w * 0.16, -h * 0.235);
      ctx.stroke();
    }

    glassPanel(-w * 0.27, -h * 0.225, w * 0.54, h * 0.135, w * 0.08);
    ctx.fillStyle = b.body;
    rr(-w * 0.255, -h * 0.09, w * 0.51, h * 0.185, w * 0.07);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.12)';
    ctx.lineWidth = Math.max(0.8, w * 0.01);
    ctx.stroke();
    glassPanel(-w * 0.235, h * 0.095, w * 0.47, h * 0.085, w * 0.045);

    ctx.fillStyle = '#1b262f';
    for (const s of [-1, 1]) {
      rr(s > 0 ? w * 0.255 : -w * 0.30, -h * 0.075, w * 0.045, h * 0.145, w * 0.02);
      ctx.fill();
    }

    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * w * 0.285, -h * 0.452);
      ctx.rotate(s * 0.38);
      lamp(-w * 0.085, -h * 0.010, w * 0.17, h * 0.020, '#eaf4ff');
      ctx.restore();
    }

    ctx.fillStyle = '#1a1d22';
    rr(-w * 0.42, h * 0.36, w * 0.84, h * 0.026, w * 0.01);
    ctx.fill();
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#d8292f';
      rr(s > 0 ? w * 0.235 : -w * 0.375, h * 0.425, w * 0.14, h * 0.028, w * 0.01);
      ctx.fill();
    }
    ctx.fillStyle = '#3a3d43';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(s * w * 0.10, h * 0.472, w * 0.028, 0, Math.PI * 2);
      ctx.fill();
    }

    sideMirror(-1, w, h, -h * 0.21);
    sideMirror(1, w, h, -h * 0.21);
  }

  const PAINTERS = {
    ferrari: paintFerrari,
    lamborghini: paintLamborghini,
    mercedes: paintGClass,
    bmw: paintI8,
    audi: paintR8,
    vw: paintBeetle,
    tesla: paintCybertruck,
    toyota: paint86
  };

  function drawCar() {
    const b = getBrand();
    const w = car.w, h = car.h;
    const bob = Math.sin(state.time * 7) * 0.9 + (state.mode === 'ready' ? Math.sin(state.time * 2) * 1.6 : 0);

    ctx.save();
    ctx.translate(state.carX, carY + bob);

    ctx.fillStyle = 'rgba(0,0,0,.20)';
    ctx.beginPath();
    ctx.ellipse(0, h * 0.02, w * 0.58, h * 0.50, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(state.tilt * 0.12);
    if (state.invuln > 0 && Math.floor(state.time * 20) % 2 === 0) ctx.globalAlpha = 0.5;

    (PAINTERS[b.id] || paintFerrari)(b, w, h);

    // 引擎盖上的真实车标
    const img = logoImgs[b.id];
    if (img && img.naturalWidth) {
      const spec = badgeSpec(b.id);
      const dw = w * spec.w;
      const dh = dw * img.naturalHeight / img.naturalWidth;
      if (spec.glow) {
        // 深色车漆上给银色车标垫一层柔光，避免看不清
        const gr = ctx.createRadialGradient(0, h * spec.y, 0, 0, h * spec.y, dw * 0.85);
        gr.addColorStop(0, 'rgba(255,255,255,.26)');
        gr.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(0, h * spec.y, dw * 0.85, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.drawImage(img, -dw / 2, h * spec.y - dh / 2, dw, dh);
    }

    ctx.restore();
  }

  // ---------- 粒子 / 提示 ----------
  const CONFETTI_COLORS = ['#ffd642', '#ff6b6b', '#6bd5ff', '#8be36b', '#c58bff', '#ff9f43'];

  function burst(x, y, n, colors, gravity = 620) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const sp = rand(60, 280);
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 60,
        g: gravity,
        rot: rand(0, Math.PI * 2),
        vr: rand(-9, 9),
        size: rand(3, 7),
        color: colors[(Math.random() * colors.length) | 0],
        life: rand(0.55, 1.25),
        ttl: 1.25,
        star: Math.random() < 0.28
      });
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const alpha = clamp(p.life / p.ttl, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.star) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rad = i % 2 ? p.size * 0.45 : p.size;
          const a = -Math.PI / 2 + i * Math.PI / 5;
          if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(-p.size * 0.5, -p.size * 0.35, p.size, p.size * 0.7);
      }
      ctx.restore();
    }
  }

  function drawToasts() {
    for (const t of toasts) {
      const alpha = clamp(t.life / t.ttl, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = '900 ' + Math.round(car.w * 0.5) + 'px system-ui, -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
      if (t.sub) {
        ctx.font = '800 ' + Math.round(car.w * 0.28) + 'px system-ui, -apple-system, "PingFang SC", sans-serif';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(255,255,255,.95)';
        ctx.strokeText(t.sub, t.x, t.y + car.w * 0.36);
        ctx.fillStyle = 'rgba(122,104,60,.9)';
        ctx.fillText(t.sub, t.x, t.y + car.w * 0.36);
      }
      ctx.restore();
    }
  }

  // ---------- 背景（静态部分离屏缓存，只画一次） ----------
  let bgCache = null;

  function buildBgCache() {
    const th = curTheme();
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * DPR));
    c.height = Math.max(1, Math.round(H * DPR));
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    const gg = g.createLinearGradient(0, 0, 0, H);
    gg.addColorStop(0, th.grass[0]);
    gg.addColorStop(1, th.grass[1]);
    g.fillStyle = gg;
    g.fillRect(0, 0, W, H);

    g.fillStyle = th.road;
    g.fillRect(roadLeft, 0, roadWidth, H);

    const eg = g.createLinearGradient(roadLeft, 0, roadRight, 0);
    eg.addColorStop(0, th.edge);
    eg.addColorStop(0.16, 'rgba(0,0,0,0)');
    eg.addColorStop(0.84, 'rgba(0,0,0,0)');
    eg.addColorStop(1, th.edge);
    g.fillStyle = eg;
    g.fillRect(roadLeft, 0, roadWidth, H);

    g.fillStyle = 'rgba(255,255,255,.55)';
    g.fillRect(roadLeft + 2, 0, 3, H);
    g.fillRect(roadRight - 5, 0, 3, H);

    bgCache = c;
  }

  function drawGrass() {
    const th = curTheme();
    if (bgCache) ctx.drawImage(bgCache, 0, 0, W, H);
    else { ctx.fillStyle = th.grass[0]; ctx.fillRect(0, 0, W, H); }

    const period = 140;
    const start = (grassOffset % period) - period;
    const lw = Math.max(0, roadLeft - 14);
    const rw = Math.max(0, W - roadRight - 14);
    ctx.fillStyle = th.stripe;
    for (let y = start; y < H + period; y += period) {
      if (lw > 0) ctx.fillRect(0, y, lw, period / 2);
      if (rw > 0) ctx.fillRect(roadRight + 14, y, rw, period / 2);
    }
  }

  function drawCurb(x, colors) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, -40, 14, H + 80);
    ctx.clip();
    const start = (curbOffset % 56) - 56 - 40;
    for (let y = start; y < H + 80; y += 56) {
      ctx.fillStyle = colors[0];
      ctx.fillRect(x, y, 14, 28);
      ctx.fillStyle = colors[1];
      ctx.fillRect(x, y + 28, 14, 28);
    }
    ctx.restore();
  }

  function drawRoad() {
    const th = curTheme();
    drawCurb(roadLeft - 14, th.curb);
    drawCurb(roadRight, th.curb);

    const dashH = 34, gap = 38, period = dashH + gap;
    const start = (dashOffset % period) - period;
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    for (let i = 1; i < LANES; i++) {
      const x = roadLeft + i * laneW;
      for (let y = start; y < H + period; y += period) {
        rr(x - 4, y, 8, dashH, 4);
        ctx.fill();
      }
    }
  }

  // ---------- 游戏逻辑 ----------
  const POWER_KINDS = ['magnet', 'shield', 'boost'];
  let quizRowSeq = 0;

  function spawnObject() {
    const lane = Math.floor(Math.random() * LANES);
    const x = roadLeft + (lane + 0.5) * laneW + rand(-laneW * 0.16, laneW * 0.16);

    // 跑过一段路后开始出现道具
    if (state.distance > 900 && Math.random() < 0.10) {
      objects.push({
        type: 'power',
        kind: POWER_KINDS[(Math.random() * POWER_KINDS.length) | 0],
        x,
        y: -70,
        s: Math.max(34, car.w * 0.72),
        phase: rand(0, Math.PI * 2),
        dead: false
      });
      return;
    }

    if (Math.random() < 0.66) {
      state.spawnStars++;
      objects.push({
        type: 'star',
        ch: nextChar(),
        x,
        y: -70,
        r: Math.max(15, car.w * 0.40),
        rot: rand(0, Math.PI * 2),
        phase: rand(0, Math.PI * 2),
        dead: false
      });
    } else {
      objects.push({
        type: Math.random() < 0.5 ? 'cone' : 'rock',
        x,
        y: -70,
        s: Math.max(28, car.w * 0.66),
        dead: false
      });
    }
  }

  // 听音选字：先播读音，再出 3 张牌（1 张正确）
  function newQuizRound() {
    const ch = nextChar();
    state.quizTarget = infoOf(ch);
    state.lastWord = state.quizTarget.w;
    lastCharEl.textContent = '听';
    state.quizTimer = 1.2;
    speakNow(state.quizTarget.w);
  }

  function spawnQuizRow() {
    if (!state.quizTarget) return;
    if (objects.some(o => o.quiz && !o.dead)) return;

    const pool = allChars().filter(o => o.c !== state.quizTarget.c);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    const usesCustom = customChars.length > 0;
    const chars = [
      state.quizTarget.c,
      pool[0] ? pool[0].c : '字',
      pool[1] ? pool[1].c : (usesCustom ? '学' : '好')
    ];
    for (let i = chars.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = chars[i]; chars[i] = chars[j]; chars[j] = t;
    }

    const lanes = [0, 1, 2, 3];
    for (let i = lanes.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = lanes[i]; lanes[i] = lanes[j]; lanes[j] = t;
    }
    const row = ++quizRowSeq;
    const y = -70;
    for (let i = 0; i < 3; i++) {
      objects.push({
        type: 'star',
        quiz: true,
        row,
        ch: chars[i],
        x: roadLeft + (lanes[i] + 0.5) * laneW,
        y,
        r: Math.max(15, car.w * 0.40),
        rot: rand(0, Math.PI * 2),
        phase: rand(0, Math.PI * 2),
        dead: false
      });
    }
    state.spawnStars += 3;
  }

  function clearQuizRow(row) {
    for (const p of objects) if (p.row === row) p.dead = true;
  }

  function collect(o) {
    o.dead = true;
    state.collectCD = 0.45;
    const info = infoOf(o.ch);
    state.stars++;
    state.combo = Math.min(state.combo + 1, 8);
    state.comboT = 1.1;
    state.goodStreak++;
    if (state.goodStreak >= 4) {
      state.goodStreak = 0;
      state.adapt = Math.min(1.12, state.adapt + 0.02);
    }
    if (state.uniqueChars) state.uniqueChars.add(o.ch);
    state.lastWord = info.w;
    learned.add(o.ch);
    saveLearned();
    starsEl.textContent = String(state.stars);
    lastCharEl.textContent = o.ch;
    burst(o.x, o.y, 12, ['#ffd642', '#fff3a0', '#ffb347'], 320);
    toasts.push({ x: o.x, y: o.y - 8, text: info.c, sub: info.p, life: 1.0, ttl: 1.0, color: '#f5a623' });
    sfxStar(state.combo);
    speakChar(info.w);
    vibrate(12);
    if (state.quiz) {
      clearQuizRow(o.row);
      state.quizTarget = null;
      state.quizTimer = 1.2;
    }
  }

  // 听音选字：点错卡片不扣分，只减速并重播读音
  function missChar(o) {
    o.dead = true;
    state.bumps++;
    state.adapt = Math.max(0.84, state.adapt - 0.03);
    state.combo = 0;
    state.speed *= 0.8;
    state.shake = 8;
    burst(o.x, o.y, 10, ['#e6e9f0', '#ff9f9f', '#ffffff'], 420);
    toasts.push({ x: o.x, y: o.y - 8, text: '再听听', life: 0.85, ttl: 0.85, color: '#ff6b6b' });
    sfxBump();
    vibrate(20);
    if (state.quiz) {
      clearQuizRow(o.row);
      state.quizTimer = 2.2;
    }
    if (state.quizTarget) speakNow(state.quizTarget.w);
  }

  function grabPower(o) {
    o.dead = true;
    const col = POWER_COLOR[o.kind];
    if (o.kind === 'magnet') state.magnet = 6;
    else if (o.kind === 'shield') state.shield = 9;
    else state.boost = 3.2;
    burst(o.x, o.y, 16, [col, '#ffffff', '#ffd642'], 380);
    toasts.push({ x: o.x, y: o.y - 10, text: POWER_LABEL[o.kind] + '！', life: 1.0, ttl: 1.0, color: col });
    sfxPower();
    vibrate(18);
    updateEffects();
  }

  function bump(o) {
    if (state.invuln > 0) return;
    o.dead = true;
    // 护盾：撞一下不会减速，护盾消失
    if (state.shield > 0) {
      state.shield = 0;
      state.shake = 6;
      burst(o.x, o.y, 18, ['#4aa8ff', '#bfe4ff', '#ffffff'], 520);
      toasts.push({ x: o.x, y: o.y - 10, text: '护盾挡住啦！', life: 0.9, ttl: 0.9, color: '#2f86d6' });
      sfxShield();
      vibrate(20);
      updateEffects();
      return;
    }
    state.invuln = 0.95;
    state.shake = 11;
    state.bumps++;
    state.adapt = Math.max(0.84, state.adapt - 0.035);
    state.carVX += (state.carX < o.x ? -1 : 1) * 150;
    state.speed *= 0.55;
    state.combo = 0;
    burst(o.x, o.y, 14, ['#d5dbe8', '#9aa3b5', '#ffd642'], 500);
    toasts.push({ x: o.x, y: o.y - 10, text: '呀！', life: 0.75, ttl: 0.75, color: '#ff6b6b' });
    sfxBump();
    vibrate(30);
  }

  function update(dt) {
    if (state.mode === 'paused') return;
    state.time += dt;

    const playing = state.mode === 'playing';
    const sp = playing ? state.speed : (state.mode === 'ready' ? 85 : 45);

    // 道具计时
    if (state.magnet > 0) state.magnet = Math.max(0, state.magnet - dt);
    if (state.collectCD > 0) state.collectCD = Math.max(0, state.collectCD - dt);
    if (state.shield > 0) state.shield = Math.max(0, state.shield - dt);
    if (state.boost > 0) state.boost = Math.max(0, state.boost - dt);
    if (state.comboT > 0) {
      state.comboT -= dt;
      if (state.comboT <= 0) state.combo = 0;
    }
    updateEffects();

    // 速度与里程（加速道具期间更快）
    if (playing) {
      const prog = Math.min(1, state.stars / state.goalChars);
      const boostK = state.boost > 0 ? 1.35 : 1;
      const target = (200 + prog * 95) * state.scale * boostK * state.adapt;
      state.speed = lerp(state.speed, target, Math.min(1, dt * 2.2));
      state.distance += state.speed * dt;
      bgmTick(dt);
    }

    // 滚动
    grassOffset += sp * dt * 0.35;
    curbOffset += sp * dt;
    dashOffset += sp * dt;

    // 转向
    if (playing) {
      let steer = btnDir || keyDir;
      if (!steer && dragTarget !== null) {
        const dx = dragTarget - state.carX;
        if (Math.abs(dx) < 2) steer = 0;
        else steer = Math.sign(dx) * Math.min(1, Math.abs(dx) / 30);
      }
      const maxVX = car.w * 8;
      state.carVX = lerp(state.carVX, steer * maxVX, Math.min(1, dt * 11));
      state.carX += state.carVX * dt;
      const pad = car.w * 0.5 + 7;
      if (state.carX < roadLeft + pad) {
        state.carX = roadLeft + pad;
        if (state.carVX < 0) state.carVX = 0;
      }
      if (state.carX > roadRight - pad) {
        state.carX = roadRight - pad;
        if (state.carVX > 0) state.carVX = 0;
      }
      state.tilt = lerp(state.tilt, clamp(steer, -1, 1), Math.min(1, dt * 9));

      // 听音选字：先读题，再出牌；收集模式按里程出物
      if (state.quiz) {
        state.quizTimer -= dt;
        if (!state.quizTarget) {
          if (state.quizTimer <= 0) newQuizRound();
        } else if (state.quizTimer <= 0) {
          spawnQuizRow();
          state.quizTimer = 3.6;
        }
      } else if (state.distance > 380) {
        state.spawnAcc += state.speed * dt;
        const spacing = 215 * state.scale;
        if (state.spawnAcc > spacing) {
          state.spawnAcc -= spacing;
          spawnObject();
        }
      }

      // 物体
      for (const o of objects) {
        o.y += state.speed * dt;
        if (o.type === 'star') o.rot += dt * 1.6;
        // 磁铁：把附近的星星吸过来（听音模式不吸，避免弄乱题目）
        if (state.magnet > 0 && o.type === 'star' && !o.quiz) {
          const dx = state.carX - o.x, dy = carY - o.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < Math.min(W, H) * 0.52) {
            const pull = 320 * dt;
            o.x += dx / d * pull;
            o.y += dy / d * pull;
          }
        }
        if (o.y > H + 90) o.dead = true;
      }

      // 碰撞
      const halfW = car.w * 0.42;
      const halfH = car.h * 0.42;
      for (const o of objects) {
        if (o.dead) continue;
        const orad = o.type === 'power' ? o.s * 0.46 : (o.type === 'star' ? o.r * 0.95 : o.s * 0.36);
        if (Math.abs(o.x - state.carX) < halfW + orad &&
            Math.abs(o.y - carY) < halfH + orad) {
          if (o.type === 'star') {
            // 冷却中先不处理，保证一次只吃一个汉字
            if (state.collectCD > 0) continue;
            if (state.quiz && o.quiz && state.quizTarget && o.ch !== state.quizTarget.c) missChar(o);
            else collect(o);
          } else if (o.type === 'power') grabPower(o);
          else bump(o);
        }
      }
      objects = objects.filter(o => !o.dead);
      state.invuln = Math.max(0, state.invuln - dt);
      state.shake = Math.max(0, state.shake - dt * 45);

      const prog = Math.min(1, state.stars / state.goalChars);
      barEl.style.width = (prog * 100).toFixed(1) + '%';
      if (state.stars >= state.goalChars) finishGame();
    } else {
      state.tilt = lerp(state.tilt, 0, Math.min(1, dt * 4));
      state.invuln = Math.max(0, state.invuln - dt);
      state.shake = Math.max(0, state.shake - dt * 45);
    }

    // 装饰滚动
    for (const d of decor) {
      d.y += sp * dt;
      if (d.y > H + 60) {
        d.y = -60;
        d.side = Math.random() < 0.5 ? -1 : 1;
        d.x = decorX(d.side);
        d.s = rand(0.6, 1.05);
        const th = curTheme();
        d.type = Math.random() < 0.62 ? th.plant : 'flower';
        d.color = th.flower[(Math.random() * th.flower.length) | 0];
      }
    }

    // 粒子
    for (const p of particles) {
      p.life -= dt;
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.99;
      p.rot += p.vr * dt;
    }
    particles = particles.filter(p => p.life > 0 && p.y < H + 80);

    // 提示文字
    for (const t of toasts) {
      t.life -= dt;
      t.y -= dt * 42;
    }
    toasts = toasts.filter(t => t.life > 0);
  }

  function draw() {
    ctx.save();
    if (state.shake > 0.5 && !reduceMotion) {
      ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
    }
    drawGrass();
    drawRoad();
    drawDecor();

    for (const o of objects) {
      if (o.type === 'star') {
        drawChar(o.x, o.y + Math.sin(state.time * 3 + o.phase) * 3, o.r, o.ch, state.time * 2.2 + o.phase);
      } else if (o.type === 'power') {
        drawPower(o.x, o.y, o.s, o.kind, state.time + o.phase);
      } else if (o.type === 'cone') {
        drawCone(o.x, o.y, o.s);
      } else {
        drawRock(o.x, o.y, o.s);
      }
    }

    // 道具光环
    if (state.shield > 0 || state.magnet > 0) {
      ctx.save();
      const cy = carY + Math.sin(state.time * 7) * 0.9;
      if (state.shield > 0) {
        ctx.strokeStyle = 'rgba(74,168,255,' + (0.45 + Math.sin(state.time * 6) * 0.18).toFixed(2) + ')';
        ctx.fillStyle = 'rgba(74,168,255,.10)';
        ctx.lineWidth = Math.max(2, car.w * 0.05);
        ctx.beginPath();
        ctx.ellipse(state.carX, cy, car.w * 0.92, car.h * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      if (state.magnet > 0) {
        ctx.strokeStyle = 'rgba(233,77,106,' + (0.30 + Math.sin(state.time * 5) * 0.12).toFixed(2) + ')';
        ctx.lineWidth = Math.max(2, car.w * 0.045);
        ctx.setLineDash([car.w * 0.22, car.w * 0.18]);
        ctx.beginPath();
        ctx.arc(state.carX, cy, Math.min(W, H) * 0.52, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    }

    drawCar();
    drawParticles();
    drawToasts();
    ctx.restore();

    if (state.invuln > 0) {
      ctx.fillStyle = 'rgba(255,90,90,' + (0.16 * state.invuln / 0.95).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- 车库 ----------
  function renderGarage() {
    garageEl.innerHTML = BRANDS.map(b => (
      '<button class="car-card' + (b.id === state.brandId ? ' on' : '') + '" data-id="' + b.id +
        '" type="button" aria-pressed="' + (b.id === state.brandId) + '">' +
        '<img class="car-logo" src="' + b.logo + '" alt="">' +
        '<span class="car-brand">' + b.brand + '</span>' +
        '<span class="car-model">' + b.model + '</span>' +

    )).join('');

  garageEl.addEventListener('click', (e) => {
    const card = e.target.closest('.car-card');
    if (!card) return;
    const id = card.dataset.id;
    if (!brandById[id] || id === state.brandId) return;
    state.brandId = id;
    try { localStorage.setItem('car-race-brand', id); } catch (err) { /* ignore */ }
    renderGarage();
    layout();

    tone(700, 0.12, 'triangle', 0.07, 0.09);

  // ---------- 道具状态条 ----------
  function updateEffects() {
    const parts = [];
    if (state.magnet > 0) parts.push(['🧲', '磁铁', state.magnet]);
    if (state.shield > 0) parts.push(['🛡️', '护盾', state.shield]);
    if (state.boost > 0) parts.push(['🚀', '加速', state.boost]);
    const sig = parts.map(p => p[1] + Math.ceil(p[2])).join('|');
    if (sig === state.fxSig) return;
    state.fxSig = sig;
    effectsEl.innerHTML = parts.map(p =>
      '<span class="fx">' + p[0] + ' ' + p[1] + ' ' + Math.ceil(p[2]) + 's</span>').join('');
  }

  // ---------- 屏幕常亮 ----------
  let wakeLock = null;
  async function requestWake() {
    try {
      if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { /* 部分浏览器不支持，忽略 */ }
  }
  function releaseWake() {
    if (!wakeLock) return;
    try { wakeLock.release(); } catch (e) { /* ignore */ }
    wakeLock = null;
  }

  // ---------- 成绩卡 ----------
  function rrOn(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  function drawCardStar(g, cx, cy, r, filled) {
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? r * 0.46 : r;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const px = cx + Math.cos(a) * rad;
      const py = cy + Math.sin(a) * rad;
      if (i === 0) g.moveTo(px, py);
      else g.lineTo(px, py);
    }
    g.closePath();
    g.fillStyle = filled ? '#ffc32b' : '#e6e9f0';
    g.fill();
    g.lineWidth = 5;
    g.strokeStyle = filled ? '#e39a12' : '#d3d7e2';
    g.stroke();
  }

  function buildScoreCard(rating) {
    const th = curTheme();
    const b = getBrand();
    const bw = 600, bh = 760;
    const c = document.createElement('canvas');
    c.width = bw;
    c.height = bh;
    const g = c.getContext('2d');

    const bg = g.createLinearGradient(0, 0, 0, bh);
    bg.addColorStop(0, th.grass[0]);
    bg.addColorStop(1, th.grass[1]);
    g.fillStyle = bg;
    g.fillRect(0, 0, bw, bh);

    g.fillStyle = '#fffaf0';
    rrOn(g, 40, 40, bw - 80, bh - 80, 40);
    g.fill();

    g.textAlign = 'center';
    g.fillStyle = '#3a3d5c';
    g.font = '900 40px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText('小车大冒险', bw / 2, 118);

    g.fillStyle = '#8a90a6';
    g.font = '800 24px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText('第 ' + state.level + ' 关 · ' + th.name, bw / 2, 162);

    for (let i = 0; i < 3; i++) {
      drawCardStar(g, bw / 2 + (i - 1) * 128, 262, 52, i < rating);
    }

    g.fillStyle = '#4a3b1c';
    g.font = '900 68px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText(String(state.stars), bw / 2, 392);
    g.fillStyle = '#8a90a6';
    g.font = '700 22px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText('个汉字 · 学会 ' + (state.uniqueChars ? state.uniqueChars.size : 0) + ' 个', bw / 2, 424);

    const img = logoImgs[b.id];
    if (img && img.naturalWidth) {
      const mw = 140, k = Math.min(mw / img.naturalWidth, 140 / img.naturalHeight);
      const dw = img.naturalWidth * k, dh = img.naturalHeight * k;
      g.drawImage(img, bw / 2 - dw / 2, 462, dw, dh);
    }

    g.fillStyle = '#3a3d5c';
    g.font = '900 32px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText(b.brand + ' ' + b.model, bw / 2, 660);

    g.fillStyle = '#b3b8c9';
    g.font = '700 18px system-ui, -apple-system, "PingFang SC", sans-serif';
    g.fillText('家庭小游戏 · 个人非商业使用', bw / 2, 692);

    const url = c.toDataURL('image/png');
    cardImgEl.src = url;
    saveCardEl.href = url;
    saveCardEl.download = 'car-race-' + state.level + '-level.png';
    cardWrapEl.classList.add('on');
  }

  // ---------- 关卡信息 ----------
  function updateLevelChip() {
    const th = curTheme();
    const best = bestStars[state.level] || 0;
    levelChipEl.innerHTML = '第 <b>' + state.level + '</b> 关 · ' + th.name +
      (best ? '　最好 ' + '★'.repeat(best) : '');
  }

  // ---------- 流程 ----------
  function startGame() {
    ensureAudio();
    unlockSpeech();
    unlockAudio();
    state.mode = 'playing';
    state.stars = 0;
    state.distance = 0;
    state.speed = 0;
    state.combo = 0;
    state.comboT = 0;
    state.magnet = 0;
    state.shield = 0;
    state.boost = 0;
    state.fxSig = '';
    state.spawnStars = 0;
    state.bumps = 0;
    state.adapt = 1;
    state.goodStreak = 0;
    state.lastWord = '';
    state.uniqueChars = new Set();
    state.goalChars = Math.min(18, 10 + state.level * 2);
    state.collectCD = 0;
    buildCharDeck(state.level);
    state.quizTarget = null;
    state.quizTimer = 1.6;
    layout();                       // 关卡主题可能变化，重建背景与装饰
    state.carX = (roadLeft + roadRight) / 2;
    state.carVX = 0;
    state.tilt = 0;
    state.invuln = 0;
    state.shake = 0;
    state.spawnAcc = 0;
    objects = [];
    particles = [];
    toasts = [];
    bgmTimer = 0;
    bgmStep = 0;
    starsEl.textContent = '0';
    barEl.style.width = '0%';
    effectsEl.innerHTML = '';
    ratingEl.querySelectorAll('span').forEach(s => s.classList.remove('on'));
    cardWrapEl.classList.remove('on');
    startScreen.classList.add('hidden');
    finishScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    hudEl.classList.remove('hidden');
    progressEl.classList.remove('hidden');
    lastCharEl.textContent = '字';
    quizBarEl.classList.toggle('on', state.quiz);
    requestWake();
    sfxStart();
  }

  function finishGame() {
    if (state.mode !== 'playing') return;
    state.mode = 'finish';
    releaseWake();
    state.fxSig = '';
    effectsEl.innerHTML = '';

    // 评价：通关 1 星，少撞车 +1 星，集齐本关全部字 +1 星
    const total = Math.max(1, state.goalChars);
    const uniq = state.uniqueChars ? state.uniqueChars.size : state.stars;
    let rating = 1;
    if (state.bumps <= 3) rating++;
    if (uniq >= total) rating++;
    rating = clamp(rating, 1, 3);
    state.rating = rating;
    if (rating > (bestStars[state.level] || 0)) {
      bestStars[state.level] = rating;
      saveProgress();
    }

    sfxWin();
    burst(W / 2, H * 0.42, 90, CONFETTI_COLORS, 700);
    barEl.style.width = '100%';
    const b = getBrand();
    finishStarsEl.textContent = String(state.stars);
    finishModelEl.textContent = b.brand + ' ' + b.model;
    finishLogoEl.src = b.logo;
    state.quizTarget = null;
    quizBarEl.classList.remove('on');

    // 本关学到的字
    const chars = state.uniqueChars ? [...state.uniqueChars] : [];
    runCharsEl.innerHTML = chars.map(ch => {
      const info = infoOf(ch);
      return '<span>' + info.c + '<i>' + info.p + '</i></span>';
    }).join('');
    runNoteEl.textContent = chars.length >= total
      ? '全字收集！奖励一颗星'
      : '本关学会 ' + chars.length + ' / ' + total + ' 个字';

    const spans = ratingEl.querySelectorAll('span');
    spans.forEach(s => s.classList.remove('on'));
    for (let i = 0; i < rating; i++) {
      setTimeout(() => spans[i] && spans[i].classList.add('on'), 300 + i * 200);
    }

    buildScoreCard(rating);
    updateLevelChip();

    setTimeout(() => {
      if (state.mode === 'finish') finishScreen.classList.remove('hidden');
    }, 650);
  }

  function nextLevel() {
    state.level = Math.min(99, state.level + 1);
    saveProgress();
    startGame();
  }

  function goGarage() {
    state.mode = 'ready';
    state.stars = 0;
    state.distance = 0;
    state.speed = 0;
    state.combo = 0;
    state.comboT = 0;
    state.magnet = 0;
    state.shield = 0;
    state.boost = 0;
    state.fxSig = '';
    state.invuln = 0;
    state.shake = 0;
    state.quizTarget = null;
    objects = [];
    particles = [];
    toasts = [];
    releaseWake();
    starsEl.textContent = '0';
    lastCharEl.textContent = '字';

    barEl.style.width = '0%';
    effectsEl.innerHTML = '';

    pauseScreen.classList.add('hidden');

  // ---------- 暂停 ----------
  function pauseGame() {
    if (state.mode !== 'playing') return;
    state.mode = 'paused';
    btnDir = 0;
    keyDir = 0;
    dragTarget = null;
    dragId = null;
    pauseScreen.classList.remove('hidden');
    releaseWake();
  }

  function resumeGame() {
    if (state.mode !== 'paused') return;
    state.mode = 'playing';
    pauseScreen.classList.add('hidden');
    last = performance.now();
    requestWake();
  }

  // ---------- 交互 ----------
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');

  function bindHold(el, dir) {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      btnDir = dir;
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    const release = (e) => {
      e.preventDefault();
      if (btnDir === dir) btnDir = 0;
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  bindHold(leftBtn, -1);
  bindHold(rightBtn, 1);

  function updateDrag(x) {
    if (state.mode !== 'playing') return;
    dragTarget = clamp(x, roadLeft + car.w * 0.5, roadRight - car.w * 0.5);
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (state.mode !== 'playing') return;
    dragId = e.pointerId;
    updateDrag(e.clientX);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (dragId === e.pointerId) updateDrag(e.clientX);
  });
  const endDrag = (e) => {
    if (dragId === e.pointerId) {
      dragId = null;
      dragTarget = null;
    }
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      keyDir = -1;
      e.preventDefault();
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keyDir = 1;
      e.preventDefault();
    } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state.mode === 'playing') pauseGame();
      else if (state.mode === 'paused') resumeGame();
      e.preventDefault();
    } else if (e.key === ' ' || e.key === 'Enter') {
      if (state.mode === 'paused') resumeGame();
      else if (state.mode === 'ready' || state.mode === 'finish') startGame();
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' ||
        e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keyDir = 0;
    }
  });

  document.getElementById('startBtn').addEventListener('click', startGame);

  // 开始页「测试语音」：直接同步朗读，用来判断是设备问题还是游戏链路问题
  document.getElementById('voiceTest').addEventListener('click', () => {
    ensureAudio();
    if (state.muted) {
      // 用户主动点「测试语音」说明想听声音，直接帮他把声音打开
      state.muted = false;
      updateMuteUI();
      try { localStorage.setItem('car-race-muted', '0'); } catch (e) { /* ignore */ }
    }
    if (!('speechSynthesis' in window)) {
      voiceWarnEl.hidden = false;
      voiceWarnEl.textContent = '这个浏览器不支持朗读，可以照着拼音读';
      return;
    }
    if (isWeChat || !('speechSynthesis' in window)) {
      unlockAudio();
      const played = playWordAudio('前面');
      voiceWarnEl.hidden = false;
      voiceWarnEl.textContent = played
        ? '已用内置录音朗读“前面”。微信不支持系统语音，想听系统朗读请点右上角 ··· → 在浏览器打开'
        : '没有找到录音，可以照着拼音读';
      return;
    }
    pickVoice();
    speechQueue = [];
    speechToken++;
    speechBusy = false;
    try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    const word = '前面';
    let ok = false;
    const u = new SpeechSynthesisUtterance(word);
    u.lang = (speechVoice && speechVoice.lang) || 'zh-CN';
    if (speechVoice) u.voice = speechVoice;
    u.rate = speechRate;
    u.pitch = 1.05;
    u.volume = 1;
    u.onstart = () => {
      ok = true;
      voiceWarnEl.hidden = false;
      voiceWarnEl.textContent = '语音正常（' + (speechVoice ? speechVoice.name : '系统默认') + '），可以开始啦';
    };
    u.onerror = (e) => {
      voiceWarnEl.hidden = false;
      voiceWarnEl.textContent = '朗读失败（' + e.error + '），请调大媒体音量或下载中文语音';
    };
    try {
      window.speechSynthesis.resume();
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
    setTimeout(() => {
      if (ok) return;
      voiceWarnEl.hidden = false;
      voiceWarnEl.textContent = '没听到声音？请调大媒体音量、关闭静音开关，或在系统设置里下载中文语音';
    }, 1600);
  });
  document.getElementById('againBtn').addEventListener('click', startGame);
  document.getElementById('changeBtn').addEventListener('click', goGarage);
  nextBtn.addEventListener('click', nextLevel);
  pauseBtn.addEventListener('click', pauseGame);
  resumeBtn.addEventListener('click', resumeGame);
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // 玩法模式切换
  modeSwitchEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    setMode(btn.dataset.mode === 'quiz');
    tone(660, 0.08, 'sine', 0, 0.08);
  });

  // HUD 汉字：点一下重听
  charPillEl.addEventListener('click', () => {
    if (state.mode !== 'playing' && state.mode !== 'paused') return;
    const word = state.quiz && state.quizTarget ? state.quizTarget.w : state.lastWord;
    speakNow(word);
  });

  // 听音模式：重播题目
  quizBarEl.addEventListener('click', () => {
    if (state.quizTarget) speakNow(state.quizTarget.w);
  });

  // 我认识的字
  learnedBtnEl.addEventListener('click', () => {
    renderLearned();
    learnedScreen.classList.remove('hidden');
  });
  document.getElementById('learnedClose').addEventListener('click', () => {
    learnedScreen.classList.add('hidden');
  });
  learnedGridEl.addEventListener('click', (e) => {
    const cell = e.target.closest('.char-cell');
    if (cell) speakNow(cell.dataset.word);
  });

  // 家长设置
  settingsBtnEl.addEventListener('click', openSettings);
  document.getElementById('setSave').addEventListener('click', saveSettings);
  document.getElementById('setClose').addEventListener('click', () => {
    settingsScreen.classList.add('hidden');
  });
  setRateEl.addEventListener('input', () => {
    speechRate = clamp(parseFloat(setRateEl.value) || 0.85, 0.6, 1.1);
  });

  // 长按 2 秒才回车库，防小孩误触
  let quitTimer = null;
  const startHold = (e) => {
    e.preventDefault();
    try { quitBtn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    quitBtn.classList.add('holding');
    if (quitTimer) clearTimeout(quitTimer);
    quitTimer = setTimeout(() => {
      quitTimer = null;
      quitBtn.classList.remove('holding');
      goGarage();
    }, 2000);
  };
  const endHold = () => {
    if (quitTimer) { clearTimeout(quitTimer); quitTimer = null; }
    quitBtn.classList.remove('holding');
  };
  quitBtn.addEventListener('pointerdown', startHold);
  quitBtn.addEventListener('pointerup', endHold);
  quitBtn.addEventListener('pointercancel', endHold);
  quitBtn.addEventListener('lostpointercapture', endHold);

  // ---------- 主循环 ----------
  let last = performance.now();
  function frame(now) {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if ((canvas.width <= 1 || canvas.height <= 1) ||
        (cw > 1 && ch > 1 && (Math.abs(cw - W) > 1 || Math.abs(ch - H) > 1))) {
      resize();
    }
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  document.addEventListener('visibilitychange', () => {
    last = performance.now();
    if (document.hidden && state.mode === 'playing') pauseGame();
    if (!document.hidden && state.mode === 'playing') requestWake();
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.ResizeObserver) {
    new ResizeObserver(() => resize()).observe(document.getElementById('stage'));
  }

  loadSettings();
  document.getElementById('wxTip').hidden = !isWeChat;
  renderGarage();
  updateLevelChip();
  resize();
  requestAnimationFrame(frame);

  // 注册 Service Worker，支持离线与添加到主屏幕
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 隐私模式等场景忽略 */ });
    });
  }
})();
</script>
</body>
</html>
