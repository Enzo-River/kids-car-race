<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#86d97a">
<title>小车大冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小车大冒险">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#4d5470;touch-action:none;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  .hud{position:absolute;left:0;right:0;top:calc(8px + env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(10px,3vw,24px);pointer-events:none;}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:999px;
    padding:4px clamp(12px,3vw,18px) 4px 10px;box-shadow:0 4px 0 rgba(0,0,0,.14);}
  .pill .ico{font-size:clamp(21px,5.4vmin,30px);line-height:1;}
  .pill .num{font-size:clamp(19px,5vmin,27px);font-weight:900;color:#4a3b1c;min-width:30px;}
  #mute{pointer-events:auto;width:clamp(40px,9vmin,54px);height:clamp(40px,9vmin,54px);
    border:none;border-radius:50%;background:rgba(255,255,255,.9);
    box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:clamp(19px,4.6vmin,26px);
    display:grid;place-items:center;cursor:pointer;}
  #mute:active{transform:translateY(2px);}

  .progress{position:absolute;left:50%;transform:translateX(-50%);
    top:calc(clamp(56px,12vmin,84px) + env(safe-area-inset-top));
    width:min(64%,520px);height:clamp(11px,2.4vmin,16px);background:rgba(255,255,255,.42);
    border-radius:999px;box-shadow:inset 0 2px 4px rgba(0,0,0,.15);pointer-events:none;}
  #progressFill{height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#ffe066,#ffb425,#ff8a3d);transition:width .12s linear;}
  .progress .flag{position:absolute;right:-14px;top:-13px;font-size:clamp(20px,4.6vmin,26px);line-height:1;}

  .controls{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;padding:0 clamp(14px,6vw,64px);pointer-events:none;}
  .ctrl{pointer-events:auto;width:clamp(76px,18vmin,112px);height:clamp(76px,18vmin,112px);
    border:none;border-radius:50%;background:rgba(255,255,255,.88);color:#4a4a63;
    font-size:clamp(26px,7vmin,40px);line-height:1;display:grid;place-items:center;cursor:pointer;
    box-shadow:0 7px 0 rgba(0,0,0,.18),inset 0 -6px 0 rgba(0,0,0,.05);
    transition:transform .06s,background .06s;touch-action:none;}
  .ctrl:active{transform:translateY(4px);background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);}

  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:clamp(10px,3vmin,26px);background:rgba(38,42,68,.42);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;
    touch-action:pan-y;overscroll-behavior:contain;}
  .overlay.hidden{display:none;}
  .hud.hidden,.progress.hidden{display:none;}
  .card{width:min(92vw,720px);max-height:calc(100dvh - clamp(20px,6vmin,52px));
    overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
    background:#fffaf0;border-radius:clamp(22px,4vmin,36px);
    padding:clamp(16px,3.2vh,28px) clamp(14px,3.4vw,28px);
    text-align:center;box-shadow:0 18px 0 rgba(0,0,0,.16),0 24px 50px rgba(0,0,0,.25);
    animation:pop .3s cubic-bezier(.2,1.5,.5,1);}
  .card.small{width:min(90vw,420px);}
  @keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
  .logo{font-size:clamp(40px,9vmin,64px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.1));}
  .card h1{margin:6px 0 2px;font-size:clamp(24px,4.4vmin,34px);color:#3a3d5c;letter-spacing:2px;}
  .card .sub{margin:4px 0 0;font-size:clamp(13px,2.5vmin,17px);color:#7a7f9c;
    font-weight:600;letter-spacing:1px;}

  .garage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:clamp(6px,1.4vmin,12px);margin-top:clamp(10px,2.2vh,18px);}
  .car-card{display:flex;flex-direction:column;align-items:center;gap:1px;
    border:3px solid transparent;border-radius:clamp(14px,2.6vmin,20px);background:#fff;
    padding:clamp(6px,1.4vh,10px) 4px;box-shadow:0 3px 0 rgba(0,0,0,.08);
    cursor:pointer;font-family:inherit;transition:transform .08s,border-color .12s;}
  .car-card:active{transform:scale(.96);}
  .car-card.on{border-color:#ffb43d;background:#fff6e2;box-shadow:0 3px 0 #e59b2a;}
  .car-logo{width:clamp(34px,7.4vmin,48px);height:clamp(34px,7.4vmin,48px);display:block;object-fit:contain;}
  .car-brand{font-size:clamp(12px,2.4vmin,15px);font-weight:900;color:#3a3d5c;line-height:1.3;}
  .car-model{font-size:clamp(10px,2vmin,12px);font-weight:600;color:#8a8fa8;line-height:1.2;}

  .big-btn{margin-top:clamp(12px,2.4vh,20px);width:100%;padding:clamp(13px,2.6vh,18px) 0;
    border:none;border-radius:999px;font-family:inherit;font-size:clamp(22px,5vmin,30px);
    font-weight:900;letter-spacing:3px;color:#fff;
    background:linear-gradient(180deg,#ffb43d,#ff8a2b);
    box-shadow:0 8px 0 #d96b12,0 10px 22px rgba(217,107,18,.35);cursor:pointer;}
  .big-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #d96b12;}
  .ghost-btn{margin-top:8px;width:100%;padding:clamp(9px,2vh,13px) 0;border:none;
    border-radius:999px;background:transparent;color:#9298b0;font-family:inherit;
    font-size:clamp(13px,2.8vmin,16px);font-weight:700;cursor:pointer;}
  .ghost-btn:active{color:#5a5f79;}
  .hint{margin:clamp(8px,2vh,16px) 0 0;font-size:clamp(12px,2.4vmin,14px);
    line-height:1.7;color:#9a9db2;}
  .tiny{margin:6px 0 0;font-size:clamp(10px,1.9vmin,12px);color:#b6bacb;line-height:1.5;}
  .score{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 2px;
    font-size:52px;font-weight:900;color:#4a3b1c;line-height:1;}
  .score span{font-size:44px;}
  .score b{font-size:56px;}
  .finish-car{display:flex;justify-content:center;margin-bottom:2px;}
  .finish-car img{width:clamp(56px,12vmin,80px);height:clamp(56px,12vmin,80px);
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.1));}

  .hud-right{display:flex;gap:clamp(6px,1.6vmin,10px);pointer-events:none;}
  #pause{pointer-events:auto;width:clamp(40px,9vmin,54px);height:clamp(40px,9vmin,54px);
    border:none;border-radius:50%;background:rgba(255,255,255,.9);
    box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:clamp(17px,4.2vmin,24px);
    display:grid;place-items:center;cursor:pointer;color:#4a4a63;}
  #pause:active{transform:translateY(2px);}

  #effects{position:absolute;left:50%;transform:translateX(-50%);
    top:calc(clamp(94px,19vmin,128px) + env(safe-area-inset-top));
    display:flex;gap:6px;pointer-events:none;}
  #effects .fx{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);
    border-radius:999px;padding:3px 9px;font-size:clamp(12px,2.6vmin,15px);font-weight:800;
    color:#4a3b1c;box-shadow:0 2px 0 rgba(0,0,0,.12);}
  #effects:empty{display:none;}

  .level-chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    background:#eef7e6;border-radius:999px;padding:4px 12px;
    font-size:clamp(12px,2.5vmin,15px);font-weight:800;color:#4f7a3a;}
  .level-chip b{color:#3a5c28;}

  .rating{display:flex;justify-content:center;gap:clamp(4px,2vw,10px);margin:6px 0 0;}
  .rating span{font-size:clamp(30px,7.6vmin,46px);line-height:1;
    filter:grayscale(1) brightness(.85);opacity:.32;transition:transform .25s,opacity .25s,filter .25s;}
  .rating span.on{filter:none;opacity:1;animation:starPop .45s cubic-bezier(.2,1.7,.5,1) both;}
  @keyframes starPop{from{transform:scale(.4) rotate(-18deg)}to{transform:scale(1) rotate(0)}}

  #cardWrap{margin:8px 0 0;display:none;}
  #cardWrap.on{display:block;}
  #cardImg{width:min(72vw,260px);border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.12);display:inline-block;}
  #saveCard{margin-top:6px;}

  #charPill{pointer-events:auto;border:none;font-family:inherit;cursor:pointer;}
  #charPill:active{transform:translateY(2px);}
  #charPill .ico{font-weight:900;color:#3b2f27;}

  .mode-switch{display:flex;gap:8px;justify-content:center;margin-top:10px;}
  .mode-btn{flex:1;max-width:180px;border:2px solid #e6e2d4;background:#fff;border-radius:999px;
    padding:8px 6px;font-family:inherit;font-size:clamp(12px,2.5vmin,15px);font-weight:800;
    color:#8a8fa8;cursor:pointer;}
  .mode-btn.on{border-color:#ffb43d;background:#fff6e2;color:#8a5a10;box-shadow:0 3px 0 #e59b2a;}

  .char-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
    margin:12px 0 4px;max-height:52vh;overflow-y:auto;overscroll-behavior:contain;}
  .char-cell{border:2px solid #f0e6cc;background:#fff;border-radius:14px;padding:6px 2px;
    font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;}
  .char-cell:active{transform:scale(.95);}
  .char-cell b{font-size:clamp(22px,5vmin,30px);color:#3b2f27;line-height:1.1;}
  .char-cell i{font-style:normal;font-size:clamp(10px,2vmin,12px);color:#a09a86;font-weight:700;}
  .empty-tip{color:#a09a86;font-size:clamp(12px,2.4vmin,14px);margin:14px 0;}

  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:12px 0;font-size:clamp(13px,2.6vmin,16px);color:#4a4a63;font-weight:700;text-align:left;}
  .set-row input[type=range]{flex:1;max-width:52%;accent-color:#ff9f2b;}
  .set-row input[type=checkbox]{width:22px;height:22px;accent-color:#ff9f2b;}
  .set-chars{width:100%;min-height:82px;border:2px solid #eee2c8;border-radius:14px;
    padding:8px;font-family:inherit;font-size:17px;line-height:1.7;color:#3b2f27;
    background:#fff;resize:vertical;}
  .set-tip{font-size:clamp(11px,2.2vmin,13px);color:#a09a86;margin:2px 0 8px;line-height:1.6;}

  .run-chars{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 2px;}
  .run-chars span{background:#fff;border:2px solid #f0e6cc;border-radius:12px;
    padding:3px 8px;font-size:clamp(16px,3.4vmin,20px);font-weight:800;color:#3b2f27;}
  .run-chars span i{font-style:normal;font-size:10px;color:#a09a86;margin-left:2px;}
  .run-note{color:#8a5a10;font-size:clamp(12px,2.4vmin,14px);font-weight:800;margin:6px 0 0;}

  #quizBar{position:absolute;left:50%;transform:translateX(-50%);
    top:calc(clamp(88px,18vmin,122px) + env(safe-area-inset-top));
    display:none;align-items:center;gap:6px;background:rgba(255,255,255,.96);
    border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 rgba(0,0,0,.14);
    font-size:clamp(12px,2.6vmin,15px);font-weight:800;color:#4a3b1c;
    pointer-events:auto;cursor:pointer;border:none;font-family:inherit;}
  #quizBar.on{display:flex;}
  #quizBar:active{transform:translateX(-50%) translateY(2px);}

  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
    .rating span.on{animation:none;}
    .ctrl,.big-btn,.car-card,.char-cell{transition:none;}
  }

  #quitBtn{position:relative;overflow:hidden;}
  #quitBtn .fill{position:absolute;left:0;top:0;height:100%;width:0;
    background:rgba(255,120,80,.20);transition:width 2s linear;pointer-events:none;}
  #quitBtn.holding .fill{width:100%;}

  @media (max-width:560px){
    .garage{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px;}
    .card{padding:16px 12px;border-radius:24px;}
    .logo{font-size:42px;}
    .car-logo{width:40px;height:40px;}
    .car-card{padding:7px 3px;border-width:2px;}
    .car-brand{font-size:13px;}
    .car-model{font-size:10px;}
    .big-btn{margin-top:12px;padding:13px 0;font-size:22px;}
    .hint{margin-top:8px;line-height:1.5;}
  }
  @media (min-width:900px){
    .card{width:min(84vw,780px);}
  }
  @media (max-height:540px){
    .card{padding:12px 16px;border-radius:22px;}
    .logo{display:none;}
    .card h1{font-size:22px;margin:0;}
    .card .sub{font-size:12px;margin-top:2px;}
    .garage{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:8px;gap:6px;}
    .car-card{padding:5px 3px;}
    .car-logo{width:30px;height:30px;}
    .car-brand{font-size:11px;}
    .car-model{display:none;}
    .big-btn{margin-top:10px;padding:11px 0;font-size:21px;}
    .hint,.tiny{display:none;}
    .finish-car img{width:46px;height:46px;}
    .score{font-size:40px;margin:6px 0 0;}
    .score b{font-size:44px;}
  }
  .voice-note{margin:8px 0 0;font-size:clamp(12px,2.3vmin,14px);color:#5a4a36;line-height:1.5;}
  .mute-tip{margin:10px 0 0;padding:8px 12px;border-radius:12px;background:#fff3d6;
    border:1px solid #f3c66a;color:#7a4b00;font-size:clamp(12px,2.4vmin,15px);line-height:1.5;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div class="hud hidden" id="hud">
    <button class="pill" id="charPill" aria-label="重听刚才的汉字">
      <span class="ico" id="lastChar">字</span><span class="num" id="starCount">0</span>
    </button>
    <div class="hud-right">
      <button id="pause" aria-label="暂停">⏸</button>
      <button id="mute" aria-label="声音开关">🔊</button>
    </div>
  </div>

  <div id="effects"></div>

  <div class="progress hidden" id="progress"><div id="progressFill"></div><span class="flag">🏁</span></div>
  <button id="quizBar" aria-label="再听一次">🔊 听一听</button>

  <div class="controls">
    <button class="ctrl" id="leftBtn" aria-label="向左">◀</button>
    <button class="ctrl" id="rightBtn" aria-label="向右">▶</button>
  </div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <div class="logo">🏎️</div>
      <h1>小车大冒险</h1>
      <p class="sub" id="startSub">选一辆喜欢的车，收集汉字学读音！</p>
      <p class="mute-tip" id="muteTip" hidden>🔇 声音现在是关闭的：点右上角喇叭打开，才能听到汉字读音</p>
      <p class="mute-tip" id="wxTip" hidden>💬 微信里朗读使用内置录音；想用系统语音，可点右上角 ··· → 在浏览器打开</p>
      <div class="level-chip" id="levelChip">第 1 关 · 城市</div>
      <div class="garage" id="garage"></div>
      <div class="mode-switch" id="modeSwitch">
        <button class="mode-btn on" data-mode="collect">收集汉字</button>
        <button class="mode-btn" data-mode="quiz">听音选字</button>
      </div>
      <button class="big-btn" id="startBtn">开始 ▶</button>
      <button class="ghost-btn" id="learnedBtn">我认识的字 · 0</button>
      <button class="ghost-btn" id="settingsBtn">家长设置</button>
      <button class="ghost-btn" id="voiceTest">🔊 测试语音</button>
      <p class="hint">按住 ◀ ▶ 左右移动 · 也可拖动小车</p>
      <p class="voice-note" id="voiceWarn" hidden></p>
      <p class="tiny">车标图片来自公开素材库，仅家庭非商业使用；商标归各品牌所有</p>
    </div>
  </div>

  <div class="overlay hidden" id="finishScreen">
    <div class="card small">
      <div class="finish-car"><img id="finishLogo" alt=""></div>
      <h1>到终点啦！</h1>
      <div class="rating" id="finishRating"><span>⭐</span><span>⭐</span><span>⭐</span></div>
      <div class="score"><span>字</span><b id="finishStars">0</b></div>
      <p class="sub" id="finishModel">法拉利 488</p>
      <div class="run-chars" id="runChars"></div>
      <p class="run-note" id="runNote"></p>
      <div id="cardWrap"><img id="cardImg" alt="成绩卡"><br>
        <a class="ghost-btn" id="saveCard" download="car-race-score.png">保存成绩图</a></div>
      <button class="big-btn" id="nextBtn">下一关 ▶</button>
      <button class="ghost-btn" id="againBtn">再玩一次 ↻</button>
      <button class="ghost-btn" id="changeBtn">换一辆车</button>
    </div>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <div class="card small">
      <div class="logo">⏸</div>
      <h1>休息一下</h1>
      <p class="sub">小车在路边等你</p>
      <button class="big-btn" id="resumeBtn">继续 ▶</button>
      <button class="ghost-btn" id="quitBtn"><span class="fill"></span>长按 2 秒回车库</button>
    </div>
  </div>

  <div class="overlay hidden" id="learnedScreen">
    <div class="card small">
      <h1>我认识的字</h1>
      <p class="sub">点一点，听读音</p>
      <div class="char-grid" id="learnedGrid"></div>
      <button class="ghost-btn" id="learnedClose">返回</button>
    </div>
  </div>

  <div class="overlay hidden" id="settingsScreen">
    <div class="card small">
      <h1>家长设置</h1>
      <div class="set-row"><span>朗读语速</span>
        <input type="range" id="setRate" min="0.6" max="1.1" step="0.05"></div>
      <div class="set-row"><span>背景音乐</span>
        <input type="checkbox" id="setBgm"></div>
      <p class="set-tip">自建字表：把想练的字粘贴到下面，留空则使用默认 49 字。每关取其中 12 个。</p>
      <textarea class="set-chars" id="setChars" placeholder="例如：山 水 田 土 日 月"></textarea>
      <button class="big-btn" id="setSave">保存</button>
      <button class="ghost-btn" id="setClose">返回</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- 基础工具 ----------
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const starsEl = document.getElementById('starCount');
  const muteBtn = document.getElementById('mute');
  const hudEl = document.getElementById('hud');
  const progressEl = document.getElementById('progress');
  const barEl = document.getElementById('progressFill');
  const startScreen = document.getElementById('startScreen');
  const finishScreen = document.getElementById('finishScreen');
  const finishStarsEl = document.getElementById('finishStars');
  const finishLogoEl = document.getElementById('finishLogo');
  const finishModelEl = document.getElementById('finishModel');
  const garageEl = document.getElementById('garage');
  const pauseBtn = document.getElementById('pause');
  const pauseScreen = document.getElementById('pauseScreen');
  const resumeBtn = document.getElementById('resumeBtn');
  const quitBtn = document.getElementById('quitBtn');
  const effectsEl = document.getElementById('effects');
  const levelChipEl = document.getElementById('levelChip');
  const ratingEl = document.getElementById('finishRating');
  const cardWrapEl = document.getElementById('cardWrap');
  const cardImgEl = document.getElementById('cardImg');
  const saveCardEl = document.getElementById('saveCard');
  const nextBtn = document.getElementById('nextBtn');
  const charPillEl = document.getElementById('charPill');
  const lastCharEl = document.getElementById('lastChar');
  const quizBarEl = document.getElementById('quizBar');
  const startSubEl = document.getElementById('startSub');
  const voiceWarnEl = document.getElementById('voiceWarn');

  function allChars() { return customChars.length ? customChars : CHARS; }
  function infoOf(ch) {
    return CHAR_MAP[ch] || { c: ch, p: '', w: ch };
  }

  // 每关只出 12 个字，按关卡轮换，一局内不重复
  let charDeck = [];
  function buildCharDeck(level) {
    const list = allChars();
    const n = list.length;
    const take = Math.min(state.goalChars || CHARS_PER_LEVEL, n);
    const start = ((level - 1) * CHARS_PER_LEVEL) % n;
    const out = [];
    for (let i = 0; i < take; i++) out.push(list[(start + i) % n]);
    for (let i = out.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
    charDeck = out;
  }
  function nextChar() {
    if (!charDeck.length) buildCharDeck(state.level);
    return charDeck.pop().c;
  }

    for (const k in bj) if (bj[k] > 0) bestStars[k] = bj[k];

  function themeOf(level) {
    return THEMES[(Math.max(1, level) - 1) % THEMES.length];
  }
  function curTheme() { return themeOf(state.level); }
  function saveProgress() {
    try {
      localStorage.setItem('car-race-level', String(state.level));
      localStorage.setItem('car-race-best', JSON.stringify(bestStars));
    } catch (e) { /* ignore */ }
  }

  // ---------- 识字记录 ----------
  let learned = new Set();
  function saveLearned() {
    try { localStorage.setItem('car-race-learned', JSON.stringify([...learned])); } catch (e) { /* ignore */ }
    updateLearnedBtn();
  }
  function updateLearnedBtn() {
    learnedBtnEl.textContent = '我认识的字 · ' + learned.size;
  }
  function renderLearned() {
    if (!learned.size) {
      learnedGridEl.innerHTML = '<p class="empty-tip">还没有收集到汉字，去路上找找吧</p>';
      return;
    }
    learnedGridEl.innerHTML = allChars()
      .filter(o => learned.has(o.c))
      .map(o => '<button class="char-cell" data-word="' + o.w + '"><b>' + o.c + '</b><i>' + o.p + '</i></button>')
      .join('');
  }

  // ---------- 玩法模式 ----------
  function setMode(quiz) {
    state.quiz = quiz;
    try { localStorage.setItem('car-race-mode', quiz ? 'quiz' : 'collect'); } catch (e) { /* ignore */ }
    modeSwitchEl.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('on', (b.dataset.mode === 'quiz') === quiz);
    });
    startSubEl.textContent = quiz ? '听读音，找出正确的字！' : '选一辆喜欢的车，收集汉字学读音！';
  }

  // ---------- 家长设置 ----------
  function loadSettings() {
    try {
      const raw = localStorage.getItem('car-race-learned');
      if (raw) JSON.parse(raw).forEach(c => learned.add(c));
      const rate = parseFloat(localStorage.getItem('car-race-rate') || '');
      if (rate >= 0.6 && rate <= 1.1) speechRate = rate;
      bgmOn = localStorage.getItem('car-race-bgm') !== '0';
      const cc = JSON.parse(localStorage.getItem('car-race-chars') || '[]');
      if (Array.isArray(cc)) customChars = cc.filter(c => typeof c === 'string' && c);
      setMode(localStorage.getItem('car-race-mode') === 'quiz');
    } catch (e) { /* ignore */ }
    updateLearnedBtn();
  }
  function openSettings() {
    setRateEl.value = String(speechRate);
    setBgmEl.checked = bgmOn;
    setCharsEl.value = customChars.join(' ');
    settingsScreen.classList.remove('hidden');
  }
  function saveSettings() {
    speechRate = clamp(parseFloat(setRateEl.value) || 0.85, 0.6, 1.1);
    bgmOn = setBgmEl.checked;
    const arr = [];
    for (const ch of (setCharsEl.value || '')) {
      if (/[\u4e00-\u9fa5]/.test(ch) && arr.indexOf(ch) < 0) arr.push(ch);
    }
    customChars = arr;
    try {
      localStorage.setItem('car-race-rate', String(speechRate));
      localStorage.setItem('car-race-bgm', bgmOn ? '1' : '0');
      localStorage.setItem('car-race-chars', JSON.stringify(customChars));
    } catch (e) { /* ignore */ }
    buildCharDeck(state.level);
    settingsScreen.classList.add('hidden');
    tone(880, 0.1, 'sine', 0, 0.1);
    if (!bgmOn) duckBgm(false);
  }

  // ---------- 声音 ----------
  let actx = null;
  function ensureAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur = 0.15, type = 'sine', delay = 0, vol = 0.16, dest) {
    if (state.muted) return;
    ensureAudio();
    if (!actx) return;
    const t0 = actx.currentTime + delay;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(dest || actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }
  // 星星连击：音高逐级升高
  const COMBO_SCALE = [784, 880, 988, 1047, 1175, 1319, 1397, 1568];
  function sfxStar(combo) {
    const f = COMBO_SCALE[clamp((combo || 1) - 1, 0, COMBO_SCALE.length - 1)];
    tone(f, 0.13, 'sine', 0, 0.12);
    tone(f * 1.5, 0.10, 'sine', 0.05, 0.05);
  }
  function sfxBump() {
    tone(150, 0.18, 'triangle', 0, 0.22);
    tone(96, 0.22, 'square', 0.03, 0.1);
  }
  function sfxStart() {
    tone(660, 0.11, 'sine', 0, 0.1);
    tone(880, 0.16, 'sine', 0.09, 0.1);
  }
  function sfxWin() {
    [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.34, 'triangle', i * 0.12, 0.13));
  }
  function sfxPower() {
    [660, 880, 1320].forEach((f, i) => tone(f, 0.12, 'triangle', i * 0.06, 0.11));
  }
  function sfxShield() {
    tone(320, 0.12, 'square', 0, 0.09);
    tone(520, 0.22, 'sine', 0.08, 0.1);
  }
  function vibrate(ms) {
    if (state.muted) return;
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ }
  }

  // 背景音乐：极轻的五声音阶循环，只在游戏中播放
  const BGM_NOTES = [523, 659, 784, 659, 587, 784, 880, 784, 523, 659, 784, 1047];
  let bgmTimer = 0, bgmStep = 0;
  let bgmGain = null;
  function bgmBus() {
    if (!actx) return null;
    if (!bgmGain) {
      bgmGain = actx.createGain();
      bgmGain.gain.value = 1;
      bgmGain.connect(actx.destination);
    }
    return bgmGain;
  }
  // 朗读时把背景音乐压低，读完恢复
  function duckBgm(on) {
    if (!actx) return;
    const g = bgmBus();
    if (!g) return;
    const t = actx.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setTargetAtTime(on ? 0.26 : 1, t, 0.09);
  }
  function bgmTick(dt) {
    if (state.muted || !bgmOn || state.mode !== 'playing') return;
    bgmTimer -= dt;
    if (bgmTimer > 0) return;
    bgmTimer = 0.32;
    const f = BGM_NOTES[bgmStep % BGM_NOTES.length];
    const acc = bgmStep % 4 === 0;
    const bus = bgmBus();
    tone(f, 0.26, 'triangle', 0, acc ? 0.045 : 0.028, bus);
    if (acc) tone(f / 2, 0.40, 'sine', 0, 0.026, bus);
    bgmStep++;
  }

  // ---------- 汉字朗读 ----------
  let speechVoice = null;
  let speechRate = 0.85;
  let bgmOn = true;
  let speechQueue = [];
  let speechBusy = false;
  let speechToken = 0;
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // 微信内置浏览器（X5 / WKWebView）基本不支持 speechSynthesis，需要用录音兜底
  const isWeChat = /MicroMessenger/i.test(navigator.userAgent);

  function voiceList() {
    try { return window.speechSynthesis.getVoices() || []; } catch (e) { return []; }
  }
  function pickVoice() {
    const vs = voiceList();
    const lang = (v) => String(v.lang || '').replace('_', '-').toLowerCase();
    speechVoice =
      vs.find(v => lang(v) === 'zh-cn') ||
      vs.find(v => /^zh-(hans|sg)/.test(lang(v))) ||
      vs.find(v => /^zh-tw/.test(lang(v))) ||
      vs.find(v => /^zh/.test(lang(v))) || null;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    window.speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }
  function checkVoiceWarn() {
    if (!voiceWarnEl) return;
    if (!('speechSynthesis' in window)) {
      voiceWarnEl.hidden = false;
      voiceWarnEl.textContent = '这个浏览器不支持朗读，可以照着拼音读';
    } else if (voiceList().length && !voiceList().some(v => /^zh/i.test(v.lang))) {
      voiceWarnEl.hidden = false;
      voiceWarnEl.textContent = '没找到中文语音，可在手机系统设置里下载中文语音';
    } else {
      voiceWarnEl.hidden = true;
    }
  }
  // 首次点击时先唤醒语音引擎（iOS 必须由用户手势触发）
  function unlockSpeech() {
    if (state.muted || !('speechSynthesis' in window)) { checkVoiceWarn(); return; }
    try {
      pickVoice();
      window.speechSynthesis.resume();
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      u.lang = 'zh-CN';
      if (speechVoice) u.voice = speechVoice;
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
    setTimeout(checkVoiceWarn, 1200);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { try { window.speechSynthesis.resume(); } catch (e) { /* ignore */ } }
  });

  const audioPool = new Map();
  // 用录音朗读（微信 / 不支持语音合成时）
  function playWordAudio(word) {
    const url = WORD_AUDIO[word];
    if (!url) return false;
    try {
      let a = audioPool.get(word);
      if (!a) {
        a = new Audio(url);
        a.preload = 'auto';
        a.playsInline = true;
        audioPool.set(word, a);
      }
      try { a.currentTime = 0; } catch (e) { /* ignore */ }
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      duckBgm(true);
      const back = () => duckBgm(false);
      a.onended = back;
      setTimeout(back, 1800);
      return true;
    } catch (e) { return false; }
  }
  // 首次用户手势里解锁音频（微信 / iOS 必需），顺便预热第一张卡
  function unlockAudio() {
    const url = WORD_AUDIO['前面'];
    if (!url) return;
    try {
      const a = new Audio(url);
      a.volume = 0.02;
      a.playsInline = true;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      setTimeout(() => { try { a.pause(); } catch (e) { /* ignore */ } }, 300);
    } catch (e) { /* ignore */ }
  }

  function pumpSpeech() {
    if (speechBusy || !speechQueue.length) return;
    if (!('speechSynthesis' in window)) return;
    // 没有中文语音时不用其他语言的语音硬读汉字，否则读音完全不对
    if (!speechVoice) pickVoice();
    // iOS 上 getVoices() 一开始常是空数组，此时用 lang 交给系统默认语音；只有明确没有中文语音才跳过
    if (!speechVoice && voiceList().length) { speechQueue = []; checkVoiceWarn(); return; }
    const word = speechQueue.shift();
    const token = ++speechToken;
    let finished = false;
    let started = false;
    let watchdog = 0;
    const done = () => {
      if (finished) return;
      finished = true;
      clearTimeout(watchdog);
      if (token !== speechToken) return;
      speechBusy = false;
      if (!speechQueue.length) duckBgm(false);
      pumpSpeech();
    };
    try {
      const u = new SpeechSynthesisUtterance(word);
      u.lang = (speechVoice && speechVoice.lang) || 'zh-CN';
      if (speechVoice) u.voice = speechVoice;
      u.rate = speechRate;
      u.pitch = 1.05;
      u.volume = 1;
      u.onstart = () => { started = true; };
      u.onend = done;
      u.onerror = done;
      speechBusy = true;
      duckBgm(true);
      window.speechSynthesis.resume();
      window.speechSynthesis.speak(u);
      // 部分浏览器 onend 不触发，超时兜底，避免队列永久卡死
      watchdog = setTimeout(done, Math.max(3000, word.length * 1200 + 1500));
      // iOS 偶尔把 speak() 吞掉且不触发任何事件：确认没出声再补一次
      setTimeout(() => {
        if (finished || started) return;
        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
        started = true;
        try {
          const u2 = new SpeechSynthesisUtterance(word);
          u2.lang = (speechVoice && speechVoice.lang) || 'zh-CN';
          if (speechVoice) u2.voice = speechVoice;
          u2.rate = speechRate;
          u2.pitch = 1.05;
          u2.volume = 1;
          u2.onend = done;
          u2.onerror = done;
          window.speechSynthesis.resume();
          window.speechSynthesis.speak(u2);
        } catch (e) { /* ignore */ }
      }, 900);
    } catch (e) {
      finished = true;
      clearTimeout(watchdog);
      speechBusy = false;
      duckBgm(false);
    }
  }
  // 排队朗读，连续吃字时不会互相截断
  function speakChar(word) {
    if (!word || state.muted) return;
    // 微信里语音合成存在但完全静音，直接用录音
    if (isWeChat || !('speechSynthesis' in window)) {
      if (playWordAudio(word)) return;
      checkVoiceWarn();
      return;
    }
    speechQueue.push(word);
    if (speechQueue.length > 2) speechQueue.splice(0, speechQueue.length - 2);
    pumpSpeech();
  }
  // 重听：清空队列，立即读当前字
  function speakNow(word) {
    if (!word || state.muted) return;
    if (isWeChat || !('speechSynthesis' in window)) { playWordAudio(word); return; }
    speechQueue = [];
    speechToken++;
    try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    speechBusy = false;
    duckBgm(false);
    // iOS 上 cancel() 后立刻 speak() 经常没有声音，稍等再读
    if (isIOS) setTimeout(() => speakChar(word), 120);
    else speakChar(word);
  }

  try {
    state.muted = localStorage.getItem('car-race-muted') === '1';
  } catch (e) { /* ignore */ }
  updateMuteUI();

  function updateMuteUI() {
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
    if (muteTipEl) muteTipEl.hidden = !state.muted;
  }
  muteBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    updateMuteUI();
    try { localStorage.setItem('car-race-muted', state.muted ? '1' : '0'); } catch (e) { /* ignore */ }
    if (!state.muted) {
      tone(880, 0.12, 'sine', 0, 0.12);
      unlockSpeech();
      unlockAudio();
    } else {
      speechQueue = [];
      speechBusy = false;
      duckBgm(false);
      if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    }
  });

  // ---------- 尺寸与布局 ----------
  function viewportSize() {
    const rect = canvas.getBoundingClientRect();
    const de = document.documentElement;
    const vv = window.visualViewport;
    const w = Math.max(
      rect.width > 1 ? rect.width : 0,
      window.innerWidth || 0,
      de ? de.clientWidth || 0 : 0,
      vv ? vv.width || 0 : 0
    );
    const h = Math.max(
      rect.height > 1 ? rect.height : 0,
      window.innerHeight || 0,
      de ? de.clientHeight || 0 : 0,
      vv ? vv.height || 0 : 0
    );
    return { w, h };
  }

  function resize() {
    const size = viewportSize();
    if (size.w < 2 || size.h < 2) return; // 布局还没就绪，等下一帧再试
    if (W === Math.round(size.w) && H === Math.round(size.h) && canvas.width > 1) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = size.w;
    H = size.h;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  function layout() {
    const brand = getBrand();

    // 竖屏手机 / 平板 / 横屏都保持合理的道路比例
    roadWidth = Math.min(W * 0.78, 700, H * 1.45);
    roadLeft = (W - roadWidth) / 2;
    roadRight = roadLeft + roadWidth;
    laneW = roadWidth / LANES;

    const ctrl = clamp(Math.min(W, H) * 0.20, 76, 112);
    car.w = clamp(roadWidth * 0.17, 46, 78);
    car.h = car.w * (brand.ratio || 2.0);
    carY = Math.max(H * 0.40, Math.min(H * 0.68, H - ctrl - 44 - car.h * 0.55));

    // 屏幕越大，速度越快，单局时长保持一致
    state.scale = clamp(H / 800, 0.72, 1.18);

    if (!initialized) {
      state.carX = (roadLeft + roadRight) / 2;
      initialized = true;
    } else if (prevWidth > 0) {
      const rel = (state.carX - prevLeft) / prevWidth;
      state.carX = roadLeft + rel * roadWidth;
    }
    state.carX = clamp(state.carX, roadLeft + car.w * 0.5 + 6, roadRight - car.w * 0.5 - 6);
    prevLeft = roadLeft;
    prevWidth = roadWidth;
    buildBgCache();
    charCache.clear();
    buildDecor();
  }

  // ---------- 装饰 ----------
  function decorX(side) {
    if (side < 0) {
      const hi = roadLeft - 24;
      return hi > 12 ? rand(10, hi) : roadLeft - 34;
    }
    const lo = roadRight + 24;
    return lo < W - 10 ? rand(lo, W - 10) : roadRight + 34;
  }

  function buildDecor() {
    decor = [];
    const th = curTheme();
    const count = 12;
    for (let i = 0; i < count; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      decor.push({
        side,
        x: decorX(side),
        y: rand(-H, H),
        s: rand(0.6, 1.05),
        type: Math.random() < 0.62 ? th.plant : 'flower',
        color: th.flower[(Math.random() * th.flower.length) | 0],
        phase: rand(0, Math.PI * 2)
      });
    }
  }

  function drawTree(x, y, s) {
    ctx.fillStyle = 'rgba(30,60,30,.16)';
    ctx.beginPath();
    ctx.ellipse(x, y + 10 * s, 16 * s, 6 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#9a6b44';
    rr(x - 3 * s, y - 8 * s, 6 * s, 22 * s, 3 * s);
    ctx.fill();
    const layers = [
      [0, -14, 17, '#3fa34d'],
      [-9, -22, 12, '#4cbf5b'],
      [9, -20, 11, '#4cbf5b'],
      [0, -30, 10, '#61d56f'],
      [-3, -35, 7, '#77e284']
    ];
    for (const [dx, dy, r, c] of layers) {
      ctx.beginPath();
      ctx.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2);
      ctx.fillStyle = c;
      ctx.fill();
    }
  }

  function drawFlower(x, y, s, color, phase) {
    const sway = Math.sin(state.time * 2 + phase) * 0.06;
    const r = 4.2 * s;
    ctx.fillStyle = color;
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI * 2 / 5 + sway;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.88, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffd05a';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.72, 0, Math.PI * 2);
    ctx.fill();
  }

  // 沙漠仙人掌
  function drawCactus(x, y, s) {
    ctx.fillStyle = 'rgba(120,90,40,.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + 12 * s, 13 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5aa86a';
    rr(x - 4.5 * s, y - 22 * s, 9 * s, 34 * s, 4.5 * s);
    ctx.fill();
    ctx.fillStyle = '#4c9a5c';
    rr(x - 14 * s, y - 8 * s, 8 * s, 14 * s, 4 * s);
    ctx.fill();
    rr(x + 6 * s, y - 14 * s, 8 * s, 16 * s, 4 * s);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = Math.max(1, 1.2 * s);
    ctx.beginPath();
    ctx.moveTo(x - 1 * s, y - 18 * s);
    ctx.lineTo(x - 1 * s, y + 8 * s);
    ctx.stroke();
  }

  // 雪松
  function drawPine(x, y, s) {
    ctx.fillStyle = 'rgba(60,90,120,.14)';
    ctx.beginPath();
    ctx.ellipse(x, y + 12 * s, 14 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#9a6b44';
    rr(x - 3 * s, y - 4 * s, 6 * s, 18 * s, 2.5 * s);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      const w = (17 - i * 4) * s;
      const yy = y - (6 + i * 10) * s;
      ctx.beginPath();
      ctx.moveTo(x, yy - 14 * s);
      ctx.lineTo(x + w, yy + 6 * s);
      ctx.quadraticCurveTo(x, yy + 1 * s, x - w, yy + 6 * s);
      ctx.closePath();
      ctx.fillStyle = i % 2 ? '#2f7a58' : '#35906a';
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.beginPath();
      ctx.moveTo(x, yy - 12 * s);
      ctx.lineTo(x + w * 0.55, yy + 3 * s);
      ctx.quadraticCurveTo(x, yy - 1 * s, x - w * 0.55, yy + 3 * s);
      ctx.closePath();
      ctx.fill();
    }
  }

  // 海边棕榈
  function drawPalm(x, y, s) {
    ctx.fillStyle = 'rgba(120,90,40,.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + 12 * s, 16 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b98b52';
    ctx.lineWidth = Math.max(2, 4 * s);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y + 10 * s);
    ctx.quadraticCurveTo(x + 5 * s, y - 6 * s, x + 2 * s, y - 18 * s);
    ctx.stroke();
    ctx.fillStyle = '#3aa564';
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i - 2) * 0.62;
      ctx.beginPath();
      ctx.ellipse(x + 2 * s + Math.cos(a) * 11 * s, y - 19 * s + Math.sin(a) * 7 * s,
        10 * s, 4.2 * s, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#7d5a2e';
    ctx.beginPath();
    ctx.arc(x + 2 * s, y - 15 * s, 2.4 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDecor() {
    for (const d of decor) {
      if (d.type === 'tree') drawTree(d.x, d.y, d.s);
      else if (d.type === 'cactus') drawCactus(d.x, d.y, d.s);
      else if (d.type === 'pine') drawPine(d.x, d.y, d.s);
      else if (d.type === 'palm') drawPalm(d.x, d.y, d.s);
      else drawFlower(d.x, d.y, d.s, d.color, d.phase);
    }
  }

  // ---------- 通用绘制 ----------
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // 汉字卡片：金边奶白圆牌 + 金色光晕；牌面与字的绘制结果缓存到离屏画布
  let charCache = new Map();

  function charPlate(ch, r) {
    const key = ch + '|' + Math.round(r);
    let hit = charCache.get(key);
    if (hit) return hit;

    const size = Math.ceil(r * 2.24);
    const S = Math.ceil(size * 2);        // 2 倍超采样
    const c = document.createElement('canvas');
    c.width = S;
    c.height = S;
    const g = c.getContext('2d');
    const k = S / (2 * r);
    g.setTransform(k, 0, 0, k, S / 2, S / 2);

    const grad = g.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.15, 0, 0, r);
    grad.addColorStop(0, '#fffdf4');
    grad.addColorStop(1, '#ffeab8');
    g.fillStyle = grad;
    g.beginPath();
    g.arc(0, 0, r, 0, Math.PI * 2);
    g.fill();
    g.lineWidth = Math.max(2, r * 0.14);
    g.strokeStyle = '#f5b21f';
    g.stroke();

    g.beginPath();
    g.arc(0, 0, r * 0.82, 0, Math.PI * 2);
    g.lineWidth = Math.max(1, r * 0.05);
    g.strokeStyle = 'rgba(245,178,31,.45)';
    g.stroke();

    g.fillStyle = '#3b2f27';
    g.font = '900 ' + Math.round(r * 1.28) + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(ch, 0, r * 0.06);

    hit = { img: c, size };
    charCache.set(key, hit);
    return hit;
  }

  function drawChar(x, y, r, ch, phase) {
    ctx.save();
    ctx.translate(x, y);

    const halo = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 1.45);
    halo.addColorStop(0, 'rgba(255,214,66,.50)');
    halo.addColorStop(1, 'rgba(255,214,66,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(Math.sin(phase) * 0.07);
    const sc = 1 + Math.sin(phase) * 0.03;
    ctx.scale(sc, sc);

    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.24, r * 0.95, r * 0.95, 0, 0, Math.PI * 2);
    ctx.fill();

    const plate = charPlate(ch, r);
    ctx.drawImage(plate.img, -plate.size / 2, -plate.size / 2, plate.size, plate.size);
    ctx.restore();
  }

  function drawCone(x, y, s) {
    const w = s * 0.95, h = s * 1.1;
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + h * 0.43, w * 0.55, h * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#b84a22';
    rr(x - w * 0.52, y + h * 0.28, w * 1.04, h * 0.18, w * 0.08);
    ctx.fill();

    const body = () => {
      ctx.beginPath();
      ctx.moveTo(x - w * 0.40, y + h * 0.33);
      ctx.quadraticCurveTo(x - w * 0.26, y - h * 0.05, x, y - h * 0.53);
      ctx.quadraticCurveTo(x + w * 0.26, y - h * 0.05, x + w * 0.40, y + h * 0.33);
      ctx.closePath();
    };
    body();
    const g = ctx.createLinearGradient(x - w * 0.4, 0, x + w * 0.4, 0);
    g.addColorStop(0, '#ffa948');
    g.addColorStop(0.5, '#ff7a1a');
    g.addColorStop(1, '#e85f0c');
    ctx.fillStyle = g;
    ctx.fill();

    ctx.save();
    body();
    ctx.clip();
    ctx.fillStyle = '#fff8ec';
    rr(x - w, y - h * 0.15, w * 2, h * 0.21, h * 0.04);
    ctx.fill();
    ctx.restore();

    body();
    ctx.strokeStyle = 'rgba(150,55,10,.35)';
    ctx.lineWidth = Math.max(1.4, s * 0.055);
    ctx.stroke();
  }

  const ROCK_R = [1, 0.86, 0.96, 0.8, 1.02, 0.88, 0.94];
  function drawRock(x, y, s) {
    const r = s * 0.5;
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.8, r * 0.95, r * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * Math.PI * 2;
      const rad = r * ROCK_R[i];
      const px = x + Math.cos(a) * rad;
      const py = y + Math.sin(a) * rad * 0.88;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
    g.addColorStop(0, '#c3cad8');
    g.addColorStop(1, '#7b8496');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#5d6577';
    ctx.lineWidth = Math.max(1.4, s * 0.06);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(x - r * 0.24, y - r * 0.26, r * 0.30, r * 0.18, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fill();
  }

  // ---------- 道具图标 ----------
  const POWER_LABEL = { magnet: '磁铁', shield: '护盾', boost: '加速' };
  const POWER_COLOR = { magnet: '#e94d6a', shield: '#4aa8ff', boost: '#ff9f43' };

  function drawPower(x, y, s, kind, t) {
    const col = POWER_COLOR[kind] || '#ff9f43';
    const bob = Math.sin(t * 4) * 2;
    ctx.save();
    ctx.translate(x, y + bob);

    ctx.fillStyle = 'rgba(255,255,255,.30)';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.64, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fffdf6';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.50, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(2, s * 0.085);
    ctx.stroke();

    const r = s * 0.30;
    ctx.fillStyle = col;
    ctx.strokeStyle = col;
    if (kind === 'magnet') {
      ctx.lineWidth = Math.max(3, s * 0.15);
      ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.arc(0, r * 0.18, r * 0.74, Math.PI, 0);
      ctx.stroke();
      ctx.fillRect(-r * 0.92, r * 0.18, r * 0.42, r * 0.58);
      ctx.fillRect(r * 0.50, r * 0.18, r * 0.42, r * 0.58);
      ctx.fillStyle = '#e8ecf4';
      ctx.fillRect(-r * 0.92, r * 0.62, r * 0.42, r * 0.20);
      ctx.fillRect(r * 0.50, r * 0.62, r * 0.42, r * 0.20);
    } else if (kind === 'shield') {
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.92, -r * 0.56);
      ctx.lineTo(r * 0.80, r * 0.34);
      ctx.quadraticCurveTo(0, r * 1.10, -r * 0.80, r * 0.34);
      ctx.lineTo(-r * 0.92, -r * 0.56);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.92, -r * 0.56);
      ctx.lineTo(r * 0.30, -r * 0.30);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(r * 0.18, -r);
      ctx.lineTo(-r * 0.62, r * 0.12);
      ctx.lineTo(-r * 0.06, r * 0.12);
      ctx.lineTo(-r * 0.20, r);
      ctx.lineTo(r * 0.62, -r * 0.16);
      ctx.lineTo(r * 0.04, -r * 0.16);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- 车身绘制（俯视，按真实车型比例与造型） ----------
  function bodyGrad(b, w) {
    const g = ctx.createLinearGradient(-w * 0.5, 0, w * 0.5, 0);
    g.addColorStop(0, b.body2);
    g.addColorStop(0.28, b.body);
    g.addColorStop(0.72, b.body);
    g.addColorStop(1, b.body2);
    return g;
  }

  function outline(w, alpha) {
    ctx.strokeStyle = 'rgba(0,0,0,' + (alpha || 0.3) + ')';
    ctx.lineWidth = Math.max(1, w * 0.016);
    ctx.stroke();
  }

  function tire(x, y, tw, th) {
    ctx.fillStyle = '#14161b';
    rr(x - tw / 2, y - th / 2, tw, th, tw * 0.42);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    rr(x - tw * 0.10, y - th * 0.33, tw * 0.40, th * 0.66, tw * 0.20);
    ctx.fill();
  }

  function wheels4(w, h, fy, ry, spread) {
    const tw = w * 0.155, th = h * 0.105;
    for (const s of [-1, 1]) {
      tire(s * w * spread, -h * fy, tw, th);
      tire(s * w * spread, h * ry, tw, th);
    }
  }

  function glassPanel(x, y, gw, gh, r) {
    const g = ctx.createLinearGradient(0, y, 0, y + gh);
    g.addColorStop(0, 'rgba(150,190,210,.9)');
    g.addColorStop(0.45, '#2a3b48');
    g.addColorStop(1, '#141d24');
    ctx.fillStyle = g;
    rr(x, y, gw, gh, r);
    ctx.fill();
    ctx.strokeStyle = 'rgba(8,12,16,.45)';
    ctx.lineWidth = Math.max(0.7, gw * 0.018);
    ctx.stroke();
  }

  function sideMirror(s, w, h, ytop) {
    const mw = w * 0.085, mh = h * 0.030;
    ctx.fillStyle = '#26292f';
    rr(s > 0 ? w * 0.46 : -w * 0.46 - mw, ytop, mw, mh, mw * 0.35);
    ctx.fill();
  }

  function lamp(x, y, lw, lh, color) {
    ctx.fillStyle = color;
    rr(x, y, lw, lh, lh * 0.45);
    ctx.fill();
  }

  function badgeSpec(id) {
    const S = {
      ferrari: { y: -0.372, w: 0.22 },
      lamborghini: { y: -0.372, w: 0.20 },
      mercedes: { y: -0.398, w: 0.18, glow: true },
      bmw: { y: -0.400, w: 0.17 },
      audi: { y: -0.396, w: 0.28 },
      vw: { y: -0.398, w: 0.19 },
      tesla: { y: -0.398, w: 0.15 },
      toyota: { y: -0.396, w: 0.24 }
    };
    return S[id] || { y: -0.394, w: 0.20 };
  }

  // 法拉利 488：低矮圆润的超跑，宽后轮拱 + 侧进气 + 圆尾灯
  function paintFerrari(b, w, h) {
    wheels4(w, h, 0.315, 0.305, 0.455);

    ctx.beginPath();
    ctx.moveTo(0, -h * 0.50);
    ctx.bezierCurveTo(-w * 0.19, -h * 0.498, -w * 0.35, -h * 0.462, -w * 0.43, -h * 0.37);
    ctx.bezierCurveTo(-w * 0.47, -h * 0.26, -w * 0.452, -h * 0.11, -w * 0.468, -h * 0.01);
    ctx.bezierCurveTo(-w * 0.498, h * 0.13, -w * 0.498, h * 0.31, -w * 0.472, h * 0.41);
    ctx.bezierCurveTo(-w * 0.43, h * 0.478, -w * 0.30, h * 0.50, -w * 0.21, h * 0.50);
    ctx.lineTo(w * 0.21, h * 0.50);
    ctx.bezierCurveTo(w * 0.30, h * 0.50, w * 0.43, h * 0.478, w * 0.472, h * 0.41);
    ctx.bezierCurveTo(w * 0.498, h * 0.31, w * 0.498, h * 0.13, w * 0.468, -h * 0.01);
    ctx.bezierCurveTo(w * 0.452, -h * 0.11, w * 0.47, -h * 0.26, w * 0.43, -h * 0.37);
    ctx.bezierCurveTo(w * 0.35, -h * 0.462, w * 0.19, -h * 0.498, 0, -h * 0.50);
    ctx.closePath();
    ctx.fillStyle = bodyGrad(b, w);
    ctx.fill();
    outline(w);

    ctx.strokeStyle = 'rgba(0,0,0,.20)';
    ctx.lineWidth = Math.max(0.8, w * 0.011);
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.10, -h * 0.475);
      ctx.quadraticCurveTo(s * w * 0.13, -h * 0.37, s * w * 0.155, -h * 0.26);
      ctx.stroke();
    }

    glassPanel(-w * 0.275, -h * 0.25, w * 0.55, h * 0.145, w * 0.09);
    ctx.fillStyle = b.body;
    rr(-w * 0.255, -h * 0.105, w * 0.51, h * 0.175, w * 0.075);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.14)';
    ctx.lineWidth = Math.max(0.8, w * 0.01);
    ctx.stroke();
    glassPanel(-w * 0.225, h * 0.07, w * 0.45, h * 0.085, w * 0.055);

    ctx.fillStyle = '#1b262f';
    for (const s of [-1, 1]) {
      rr(s > 0 ? w * 0.255 : -w * 0.30, -h * 0.085, w * 0.045, h * 0.145, w * 0.02);
      ctx.fill();
    }

    ctx.fillStyle = '#1a1d22';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.40, h * 0.075);
      ctx.lineTo(s * w * 0.455, h * 0.04);
      ctx.lineTo(s * w * 0.46, h * 0.20);
      ctx.lineTo(s * w * 0.395, h * 0.245);
      ctx.closePath();
      ctx.fill();
    }

    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * w * 0.285, -h * 0.45);
      ctx.rotate(s * 0.45);
      lamp(-w * 0.095, -h * 0.012, w * 0.19, h * 0.024, '#eef6ff');
      ctx.restore();
    }

    ctx.fillStyle = '#191c20';
    rr(-w * 0.20, h * 0.452, w * 0.40, h * 0.042, w * 0.014);
    ctx.fill();
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#e8342f';
      ctx.beginPath();
      ctx.arc(s * w * 0.315, h * 0.462, w * 0.043, 0, Math.PI * 2);
      ctx.fill();
    }

    sideMirror(-1, w, h, -h * 0.215);
    sideMirror(1, w, h, -h * 0.215);
  }

  // 兰博基尼 Aventador：楔形折面车身 + 黑色车顶 + Y 形灯
  function paintLamborghini(b, w, h) {
    wheels4(w, h, 0.315, 0.30, 0.462);

    ctx.beginPath();
    ctx.moveTo(-w * 0.13, -h * 0.50);
    ctx.lineTo(w * 0.13, -h * 0.50);
    ctx.lineTo(w * 0.36, -h * 0.445);
    ctx.lineTo(w * 0.46, -h * 0.30);
    ctx.lineTo(w * 0.445, -h * 0.10);
    ctx.lineTo(w * 0.485, h * 0.02);
    ctx.lineTo(w * 0.495, h * 0.33);
    ctx.lineTo(w * 0.44, h * 0.47);
    ctx.lineTo(w * 0.30, h * 0.50);
    ctx.lineTo(-w * 0.30, h * 0.50);
    ctx.lineTo(-w * 0.44, h * 0.47);
    ctx.lineTo(-w * 0.495, h * 0.33);
    ctx.lineTo(-w * 0.485, h * 0.02);
    ctx.lineTo(-w * 0.445, -h * 0.10);
    ctx.lineTo(-w * 0.46, -h * 0.30);
    ctx.lineTo(-w * 0.36, -h * 0.445);
    ctx.closePath();
    ctx.fillStyle = bodyGrad(b, w);
    ctx.fill();
    outline(w);

    ctx.fillStyle = '#17181c';
    ctx.beginPath();
    ctx.moveTo(-w * 0.24, -h * 0.135);
    ctx.lineTo(w * 0.24, -h * 0.135);
    ctx.lineTo(w * 0.21, h * 0.14);
    ctx.lineTo(-w * 0.21, h * 0.14);
    ctx.closePath();
    ctx.fill();

    glassPanel(-w * 0.26, -h * 0.255, w * 0.52, h * 0.125, w * 0.045);
    glassPanel(-w * 0.20, h * 0.135, w * 0.40, h * 0.065, w * 0.025);

    ctx.strokeStyle = '#f4f8ff';
    ctx.lineWidth = Math.max(1, w * 0.022);
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.345, -h * 0.452);
      ctx.lineTo(s * w * 0.29, -h * 0.412);
      ctx.lineTo(s * w * 0.335, -h * 0.372);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';

    ctx.fillStyle = '#17181c';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.415, h * 0.10);
      ctx.lineTo(s * w * 0.48, h * 0.07);
      ctx.lineTo(s * w * 0.48, h * 0.27);
      ctx.lineTo(s * w * 0.40, h * 0.30);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = '#17181c';
    rr(-w * 0.44, h * 0.315, w * 0.88, h * 0.032, w * 0.01);
    ctx.fill();
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#e8342f';
      rr(s > 0 ? w * 0.195 : -w * 0.335, h * 0.442, w * 0.14, h * 0.026, w * 0.01);
      ctx.fill();
    }
    ctx.fillStyle = '#3a3d43';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(s * w * 0.075, h * 0.482, w * 0.026, 0, Math.PI * 2);
      ctx.fill();
    }

    sideMirror(-1, w, h, -h * 0.19);
    sideMirror(1, w, h, -h * 0.19);
  }

  // 奔驰 G 级：方盒子车身、平直前风挡、车顶行李架、后背胎
  function paintGClass(b, w, h) {
    const tw = w * 0.165, th = h * 0.10;
    for (const s of [-1, 1]) {
      tire(s * w * 0.455, -h * 0.315, tw, th);
      tire(s * w * 0.455, h * 0.285, tw, th);
    }

    ctx.beginPath();
    ctx.moveTo(-w * 0.455, -h * 0.49);
    ctx.lineTo(w * 0.455, -h * 0.49);
    ctx.lineTo(w * 0.475, -h * 0.44);
    ctx.lineTo(w * 0.475, h * 0.44);
    ctx.lineTo(w * 0.445, h * 0.49);
    ctx.lineTo(-w * 0.445, h * 0.49);
    ctx.lineTo(-w * 0.475, h * 0.44);
    ctx.lineTo(-w * 0.475, -h * 0.44);
    ctx.closePath();
    ctx.fillStyle = bodyGrad(b, w);
    ctx.fill();
    outline(w);

    ctx.fillStyle = '#1c1f24';
    rr(-w * 0.23, -h * 0.478, w * 0.46, h * 0.03, w * 0.008);
    ctx.fill();
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#f6f7ea';
      ctx.beginPath();
      ctx.arc(s * w * 0.33, -h * 0.455, w * 0.055, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f2a13a';
      rr(s > 0 ? w * 0.395 : -w * 0.455, -h * 0.395, w * 0.06, h * 0.013, w * 0.006);
      ctx.fill();
    }

    glassPanel(-w * 0.375, -h * 0.345, w * 0.75, h * 0.085, w * 0.018);

    ctx.fillStyle = b.body;
    rr(-w * 0.40, -h * 0.255, w * 0.80, h * 0.395, w * 0.03);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.20)';
    ctx.lineWidth = Math.max(0.8, w * 0.011);
    for (const rx of [-0.22, 0, 0.22]) {
      ctx.beginPath();
      ctx.moveTo(w * rx, -h * 0.245);
      ctx.lineTo(w * rx, h * 0.13);
      ctx.stroke();
    }

    ctx.fillStyle = '#1b262f';
    for (const s of [-1, 1]) {
      rr(s > 0 ? w * 0.385 : -w * 0.44, -h * 0.245, w * 0.055, h * 0.335, w * 0.012);
      ctx.fill();
    }

    ctx.fillStyle = '#202329';
    for (const yy of [-0.235, -0.075, 0.085]) {
      rr(-w * 0.42, h * yy, w * 0.84, h * 0.011, w * 0.004);
      ctx.fill();
    }

    ctx.fillStyle = '#1b1e23';
    ctx.beginPath();
    ctx.arc(0, h * 0.50, w * 0.125, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8c929b';
    ctx.beginPath();
    ctx.arc(0, h * 0.50, w * 0.055, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.lineWidth = Math.max(0.8, w * 0.01);
    ctx.beginPath();
    ctx.arc(0, h * 0.50, w * 0.125, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#26292f';
    for (const s of [-1, 1]) {
      ctx.fillRect(s * w * 0.47 - (s > 0 ? 0 : w * 0.055), -h * 0.30, w * 0.055, h * 0.035);
    }
  }

  // 宝马 i8：水滴形车身、玻璃座舱、蓝色侧裙线
  function paintI8(b, w, h) {
    wheels4(w, h, 0.315, 0.30, 0.455);

    ctx.beginPath();
    ctx.moveTo(0, -h * 0.50);
    ctx.bezierCurveTo(-w * 0.22, -h * 0.50, -w * 0.35, -h * 0.45, -w * 0.40, -h * 0.335);
    ctx.bezierCurveTo(-w * 0.44, -h * 0.18, -w * 0.41, h * 0.02, -w * 0.45, h * 0.17);
    ctx.bezierCurveTo(-w * 0.49, h * 0.30, -w * 0.49, h * 0.44, -w * 0.42, h * 0.49);
    ctx.lineTo(w * 0.42, h * 0.49);
    ctx.bezierCurveTo(w * 0.49, h * 0.44, w * 0.49, h * 0.30, w * 0.45, h * 0.17);
    ctx.bezierCurveTo(w * 0.41, h * 0.02, w * 0.44, -h * 0.18, w * 0.40, -h * 0.335);
    ctx.bezierCurveTo(w * 0.35, -h * 0.45, w * 0.22, -h * 0.50, 0, -h * 0.50);
    ctx.closePath();
    ctx.fillStyle = bodyGrad(b, w);
    ctx.fill();
    outline(w);

    glassPanel(-w * 0.275, -h * 0.255, w * 0.55, h * 0.135, w * 0.11);
    ctx.fillStyle = '#1d2127';
    rr(-w * 0.245, -h * 0.12, w * 0.49, h * 0.25, w * 0.10);
    ctx.fill();
    glassPanel(-w * 0.225, h * 0.125, w * 0.45, h * 0.075, w * 0.05);

    ctx.strokeStyle = b.accent;
    ctx.lineWidth = Math.max(1, w * 0.02);
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.40, -h * 0.30);
      ctx.quadraticCurveTo(s * w * 0.44, -h * 0.05, s * w * 0.42, h * 0.30);
      ctx.stroke();
    }

    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * w * 0.27, -h * 0.462);
      ctx.rotate(s * 0.35);
      lamp(-w * 0.10, -h * 0.010, w * 0.20, h * 0.020, '#e8f4ff');
      ctx.restore();
    }

    ctx.fillStyle = '#191c20';
    rr(-w * 0.30, h * 0.415, w * 0.60, h * 0.055, w * 0.015);
    ctx.fill();
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#d92b32';
      rr(s > 0 ? w * 0.26 : -w * 0.40, h * 0.435, w * 0.14, h * 0.022, w * 0.008);
      ctx.fill();
    }

    sideMirror(-1, w, h, -h * 0.215);
    sideMirror(1, w, h, -h * 0.215);
  }

  // 奥迪 R8：宽体、短前悬、黑色侧翼板 + 六边形前格栅
  function paintR8(b, w, h) {
    wheels4(w, h, 0.315, 0.305, 0.462);

    ctx.beginPath();
    ctx.moveTo(0, -h * 0.50);
    ctx.bezierCurveTo(-w * 0.20, -h * 0.50, -w * 0.33, -h * 0.47, -w * 0.39, -h * 0.40);
    ctx.bezierCurveTo(-w * 0.455, -h * 0.30, -w * 0.465, -h * 0.10, -w * 0.47, h * 0.02);
    ctx.bezierCurveTo(-w * 0.49, h * 0.16, -w * 0.49, h * 0.34, -w * 0.45, h * 0.44);
    ctx.bezierCurveTo(-w * 0.40, h * 0.49, -w * 0.28, h * 0.50, -w * 0.16, h * 0.50);
    ctx.lineTo(w * 0.16, h * 0.50);
    ctx.bezierCurveTo(w * 0.28, h * 0.50, w * 0.40, h * 0.49, w * 0.45, h * 0.44);
    ctx.bezierCurveTo(w * 0.49, h * 0.34, w * 0.49, h * 0.16, w * 0.47, h * 0.02);
    ctx.bezierCurveTo(w * 0.465, -h * 0.10, w * 0.455, -h * 0.30, w * 0.39, -h * 0.40);
    ctx.bezierCurveTo(w * 0.33, -h * 0.47, w * 0.20, -h * 0.50, 0, -h * 0.50);
    ctx.closePath();
    ctx.fillStyle = bodyGrad(b, w);
    ctx.fill();
    outline(w);

    ctx.fillStyle = '#22252b';
    ctx.beginPath();
    ctx.moveTo(-w * 0.20, -h * 0.485);
    ctx.lineTo(w * 0.20, -h * 0.485);
    ctx.lineTo(w * 0.15, -h * 0.445);
    ctx.lineTo(-w * 0.15, -h * 0.445);
    ctx.closePath();
    ctx.fill();

    glassPanel(-w * 0.26, -h * 0.255, w * 0.52, h * 0.15, w * 0.10);
    ctx.fillStyle = b.body;
    rr(-w * 0.245, -h * 0.105, w * 0.49, h * 0.175, w * 0.075);
    ctx.fill();
    glassPanel(-w * 0.22, h * 0.07, w * 0.44, h * 0.085, w * 0.05);

    ctx.fillStyle = '#22252b';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.405, h * 0.015);
      ctx.lineTo(s * w * 0.465, -h * 0.015);
      ctx.lineTo(s * w * 0.47, h * 0.235);
      ctx.lineTo(s * w * 0.40, h * 0.265);
      ctx.closePath();

    for (const s of [-1, 1]) {
